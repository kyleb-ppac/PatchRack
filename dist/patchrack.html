<title>PatchRack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Rack elevations and patchlists that stay in sync.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell = top bar + one working view; the rack view is a scrolling
   "stage" of rack elevations with an inspector beside it. Gear faceplates are
   always dark metal (like the real thing) in both themes. */
:root {
  --bg: #eceff3;
  --panel: #ffffff;
  --panel-2: #f6f8fa;
  --fg: #18202a;
  --muted: #5a6776;
  --line: #d3d9e0;
  --accent: #3a5068;          /* Peace Portal slate */
  --accent-fg: #ffffff;
  --accent-soft: #dfe7ef;
  --trace: #f2a900;
  --err: #c2362f;
  --warn: #b26a00;
  --info: #2f6f9f;
  --ok: #2f7d4f;
  --rig: #b86e00;             /* rig-edit mode */
  --rig-bg: #fbf1df;

  /* hardware (same in both themes) */
  --metal: #23272c;
  --metal-2: #2c3137;
  --rail: #121417;
  --silk: #d7dce1;
  --silk-dim: #8c949c;
  --jack: #0c0e10;
  --ring-in: #c7ced6;
  --ring-out: #e3a548;
  --ring-io: #6fbf8e;
  --ring-v: #9aa3ad;
  --plug: #f4f6f8;

  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --panel: #192028; --panel-2: #1f2730; --fg: #e5eaf0; --muted: #95a2b0;
    --line: #2c3540; --accent: #8db1d6; --accent-fg: #0f1720; --accent-soft: #24313f;
    --err: #ff7a70; --warn: #f0b456; --info: #7fb6e6; --ok: #73c995;
    --rig: #f0a830; --rig-bg: #2a2216;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --panel: #192028; --panel-2: #1f2730; --fg: #e5eaf0; --muted: #95a2b0;
  --line: #2c3540; --accent: #8db1d6; --accent-fg: #0f1720; --accent-soft: #24313f;
  --err: #ff7a70; --warn: #f0b456; --info: #7fb6e6; --ok: #73c995;
  --rig: #f0a830; --rig-bg: #2a2216;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.4 var(--f-ui);
  display: flex; flex-direction: column; min-height: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .port:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.danger { color: var(--err); }
button.armed { background: var(--err); color: #fff; border-color: var(--err); }
button:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-width: 0;
}
input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.spacer { flex: 1; }
h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; } h3 { font-size: 17px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: .03em; }
.brand .ver { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: 0; align-self: flex-end; margin: 0 0 4px -3px; }
.brand-mark { width: 22px; height: 22px; border-radius: 3px; background:
  radial-gradient(circle at 30% 35%, var(--accent-fg) 0 2.5px, transparent 3px),
  radial-gradient(circle at 70% 35%, var(--accent-fg) 0 2.5px, transparent 3px),
  radial-gradient(circle at 30% 70%, var(--accent-fg) 0 2.5px, transparent 3px),
  radial-gradient(circle at 70% 70%, var(--accent-fg) 0 2.5px, transparent 3px), var(--accent); }
.proj-name { font-weight: 600; width: 230px; max-width: 100%; }
.patch-pick { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.patch-pick select { color: var(--fg); font-size: 14px; max-width: 200px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; border-radius: 4px; padding: 6px 10px; color: var(--muted); font-weight: 500; }
.tabs button.on { background: var(--accent-soft); color: var(--fg); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; background: var(--err); color: #fff; margin-left: 4px; font-family: var(--f-mono); }
.badge.warn { background: var(--warn); }
.badge.zero { background: var(--ok); }
.top-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.gh-status { font-size: 12px; font-weight: 500; }
.gh-status.dirty { border-color: var(--warn); color: var(--warn); }
.gh-status.clean { color: var(--ok); }
.gh-status.clean::before { content: "✓ "; }
.menu { position: relative; }
.view-pop { width: 300px; gap: 8px; padding: 12px; }
.view-pop .legend { display: grid; gap: 4px; }
.typelist { display: grid; gap: 4px; }
.swl { display: inline-block; width: 20px; height: 4px; border-radius: 2px; background: var(--c); flex: none; }
details.sec { border-top: 1px solid var(--line); padding-top: 8px; }
details.sec > summary { cursor: pointer; list-style: none; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > summary:hover { color: var(--fg); }
.sec-body { display: grid; gap: 8px; margin-top: 8px; }
.iprow { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 8px; align-items: center; font-size: 12px; }
.iprow input + input { grid-column: 2; }
.iprow.ro { grid-template-columns: 90px 120px minmax(0, 1fr); }
input.bad, span.bad { color: var(--err); border-color: var(--err); }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.photo-slot { display: grid; gap: 4px; align-content: start; }
.photo-slot img { width: 100%; border-radius: 3px; border: 1px solid var(--line); display: block; object-fit: cover; }
.photo-empty { min-height: 0; }
.kvrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 4px; }
.kvrow button { padding: 2px 8px; }
.field textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
.pe-wrap { overflow: auto; background: repeating-conic-gradient(var(--panel-2) 0 25%, var(--bg) 0 50%) 0 0 / 16px 16px; padding: 14px; border-radius: 6px; display: flex; justify-content: center; }
#pe-canvas { display: block; cursor: grab; touch-action: none; box-shadow: 0 0 0 2px var(--accent), 0 6px 20px rgba(0,0,0,.35); }
#pe-canvas:active { cursor: grabbing; }
.pe-controls { align-items: center; }
.pe-controls input[type=range] { width: 150px; }
/* rig sheet */
.paper.sheet h4 { margin-top: 14px; }
.paper.sheet .s-rack { margin-top: 8px; break-inside: auto; }
.paper.sheet .s-rack-h { color: #fff; padding: 3px 8px; font-weight: 600; font-size: 1.05em; }
.paper.sheet table.s-tbl { width: 100%; border-collapse: collapse; }
.paper.sheet table.s-tbl td { border: 0; border-bottom: 1px solid #d5d5d5; padding: 4px 6px; vertical-align: top; }
.paper.sheet td.s-u { width: 62px; font-family: var(--f-mono); color: #333; white-space: nowrap; }
.paper.sheet .s-side { font-size: .85em; color: #777; }
.paper.sheet .s-model { color: #555; }
.paper.sheet .s-meta { color: #333; font-size: .95em; margin-top: 1px; }
.paper.sheet .s-mono { font-family: var(--f-mono); }
.paper.sheet .s-notes { white-space: pre-wrap; font-size: .95em; color: #333; border-left: 2px solid #ccc; padding-left: 6px; margin-top: 2px; }
.paper.sheet .s-conns { margin: 3px 0 0; padding-left: 16px; font-size: .95em; }
.paper.sheet .s-conns li { margin: 1px 0; }
.paper.sheet .s-mine { font-weight: 600; }
.paper.sheet .s-tag { font-size: .82em; color: #555; border: 1px solid #bbb; border-radius: 3px; padding: 0 3px; white-space: nowrap; }
.paper.sheet .s-empty { color: #999; font-style: italic; }
.paper.sheet tr { break-inside: avoid; }
.photo-empty { height: 40px; border: 1px dashed var(--line); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
.dev.photo { background-size: 100% 100%; background-repeat: no-repeat; background-color: #202327; --jack: rgba(0, 0, 0, .15); }
.dev.photo::before, .dev.photo::after { display: none; }
.dev.photo .pn, .dev.photo .grp-label { display: none; }
.dev.photo .dev-label { right: auto; max-width: calc(100% - 84px); background: rgba(10, 12, 14, .72); border-radius: 2px; padding: 0 5px; }
.dev.photo .port { box-shadow: inset 0 0 0 1.5px var(--ring, var(--ring-in)), 0 0 0 1px rgba(0, 0, 0, .6); }
.menu > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: var(--r); padding: 5px 10px; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: 250px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 2px;
}
.menu-pop button { border: 0; text-align: left; }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tog { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
.seg { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg > span { padding: 0 8px; font-size: 12px; color: var(--muted); }
.seg button { border: 0; border-left: 1px solid var(--line); border-radius: 0; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.seg button.rigbtn.on { background: var(--rig); color: #fff; }
.mode-hint { font-size: 13px; padding: 6px 12px; border-radius: var(--r); background: var(--accent-soft); }
.mode-hint.rig { background: var(--rig-bg); box-shadow: inset 3px 0 0 var(--rig); }
.stage.rig { border: 2px solid var(--rig); background: var(--rig-bg); }
.stage.rig .dev-label { cursor: grab; }
.stage.rig .dev-label:active { cursor: grabbing; }
.reorder { display: inline-flex; gap: 2px; }
.reorder button { font-size: 10px; padding: 1px 6px; }
.dev.dragging { opacity: .35; }
.ghost {
  position: absolute; z-index: 8; pointer-events: none; border: 2px dashed #6fbf8e; border-radius: 3px;
  background: rgba(111,191,142,.22); color: #f2fff6; text-shadow: 0 1px 3px #000, 0 0 2px #000; font: 600 13px var(--f-mono);
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px;
}
.ghost.bad { border-color: #ff7a70; background: rgba(194,54,47,.22); color: #ffe1de; }
.note {
  background: var(--accent-soft); border-radius: var(--r); padding: 8px 12px; font-size: 13px;
  display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
}
.note button { padding: 2px 8px; }

/* ---------- rack view ---------- */
.rack-split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .rack-split { grid-template-columns: minmax(0, 1fr); } }
.stage {
  overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2);
  max-height: calc(100vh - 170px); min-height: 360px; user-select: none; -webkit-user-select: none;
}
.stage-inner { position: relative; display: flex; flex-direction: column; gap: 22px; padding: 18px; align-items: flex-start; width: max-content; }
.area { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 55%, transparent); }
.area-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.area-title { font-size: 21px; }
span.area-title { font-family: var(--f-display); font-weight: 600; letter-spacing: .03em; }
.area-row { display: flex; gap: 28px; align-items: flex-start; }
.cables { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 5; }
.cables path.hit { pointer-events: stroke; cursor: pointer; }
.rack { flex: none; }
.rack-head, .loc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rack-title { font-family: var(--f-display); font-size: 18px; font-weight: 600; letter-spacing: .03em; cursor: pointer; background: none; border: 0; padding: 0; }
.rack-title:hover { color: var(--accent); }
.face-btn { font-size: 11px; padding: 2px 8px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.rack-body { position: relative; display: grid; grid-template-columns: 22px auto 22px; background: var(--rail); border-radius: 4px; padding: 6px 0; }
.rail { position: relative; }
.rail span { position: absolute; left: 0; right: 0; text-align: center; font: 9px/1 var(--f-mono); color: #6f7880; }
.rail i { position: absolute; left: 7px; width: 8px; height: 5px; border-radius: 2px; background: #2e3338; }
.rack-bay { position: relative; background: repeating-linear-gradient(180deg, #181b1f 0 47px, #1d2126 47px 48px); }
.slot {
  position: absolute; border: 1px dashed transparent; color: transparent; font: 11px var(--f-mono);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.slot:hover, .slot.sel { border-color: #5d6670; color: #9aa3ad; }
.slot.sel { border-style: solid; border-color: var(--trace); color: var(--trace); }

.dev {
  position: absolute; background: linear-gradient(180deg, var(--metal-2), var(--metal)); border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 1px 0 rgba(0,0,0,.6);
  color: var(--silk); overflow: hidden;
}
.dev::before, .dev::after { /* rack ear screws */
  content: ""; position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: #4b5259; box-shadow: inset 0 0 0 1px #1a1d20;
}
.dev::before { left: 4px; } .dev::after { right: 4px; }
.dev.half-L::after, .dev.half-R::before { display: none; }
.dev.free::before, .dev.free::after { display: none; }
.dev.sel { box-shadow: inset 0 0 0 2px var(--trace); }
.dev-label {
  position: absolute; left: 12px; right: 12px; top: 2px; height: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font: 600 10.5px/13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
}
.dev-label b { color: #fff; font-weight: 600; }
.dev-label em { font-style: normal; color: var(--silk-dim); }
.dev-label .unv { color: #e3a548; margin-left: 4px; }
.dev-empty { position: absolute; left: 12px; bottom: 4px; font-size: 10px; color: var(--silk-dim); }
.grp-label { position: absolute; font: 600 8.5px/10px var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--silk-dim); white-space: nowrap; }
.dev.st-blank { background: linear-gradient(180deg, #2b3036, #24282d); }
.dev.st-vent { background: repeating-linear-gradient(90deg, #2a2f35 0 10px, #111316 10px 13px); background-size: 100% 60%; background-position: center; background-repeat: no-repeat; background-color: #2a2f35; }
.dev.st-drawer .dev-empty { left: 50%; transform: translateX(-50%); bottom: 50%; width: 90px; height: 7px; border-radius: 4px; background: #4a5057; font-size: 0; }

.port {
  position: absolute; border-radius: 50%; background: var(--fill, var(--jack));
  box-shadow: inset 0 0 0 2px var(--ring, var(--ring-in)), 0 0 0 1px #000;
  cursor: crosshair; touch-action: none;
}
.port.d-in { --ring: var(--ring-in); }
.port.d-out { --ring: var(--ring-out); }
.port.d-io { --ring: var(--ring-io); }
.port.c-rj45, .port.c-sfp { border-radius: 2px; }
.port.c-iec, .port.c-nema { border-radius: 3px; }
.port.c-phoenix { border-radius: 1px; }
.port.c-ethercon::before { content: ""; position: absolute; inset: 28% 24%; border-radius: 1px; background: rgba(255,255,255,.12); }
.port.plugged::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--plug); box-shadow: 0 0 0 1px #000; }
.port.c-rj45.plugged::after, .port.c-sfp.plugged::after, .port.c-iec.plugged::after, .port.c-phoenix.plugged::after { border-radius: 1px; }
.port.hl { box-shadow: inset 0 0 0 2px var(--trace), 0 0 0 2px var(--trace), 0 0 10px 2px rgba(242,169,0,.55); }
.port.sel { box-shadow: inset 0 0 0 2px #fff, 0 0 0 3px var(--trace), 0 0 12px 3px rgba(242,169,0,.7); }
.port.drop { box-shadow: 0 0 0 3px #6fbf8e; }
.pn { position: absolute; font: 500 8px/1 var(--f-mono); color: var(--silk-dim); text-align: center; white-space: nowrap; pointer-events: none; }
.pn.named { color: var(--silk); }

.locs { display: flex; flex-direction: column; gap: 22px; flex: none; }
.loc { flex: none; }
.loc-body { position: relative; border: 1px dashed #6b747d; border-radius: 6px; }
.stage.rig .loc-body { background-image: radial-gradient(circle, rgba(120,128,138,.35) 1px, transparent 1.2px); background-size: 10px 10px; }
.loc-empty { position: absolute; left: 12px; top: 12px; }
.stage.rig .loc-gear { padding-bottom: 96px; }  /* room to drop gear below and grow the area */
.rack-body { position: relative; }
.rack-faces { display: flex; gap: 18px; align-items: flex-start; }
.face-cap { font: 600 11px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.note.pick { background: var(--rig-bg); box-shadow: inset 3px 0 0 var(--ok); }
.rack-grip { position: absolute; left: 0; right: 0; bottom: -7px; height: 12px; cursor: ns-resize; z-index: 4; display: flex; justify-content: center; align-items: center; }
.rack-grip::after { content: ""; width: 60px; height: 5px; border-radius: 3px; background: var(--rig); box-shadow: 0 0 0 2px var(--rig-bg); }
.rack-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
.rack-foot button { font-size: 12px; padding: 3px 10px; }
.cab-tog {
  position: absolute; top: 2px; right: 12px; z-index: 3; font: 600 9px/12px var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  padding: 0 5px; border-radius: 3px; border: 1px solid #4b5259; background: #1a1d21; color: #7d868f; cursor: pointer;
}
.cab-tog.on { color: #0f1a12; background: #8fd1a6; border-color: #8fd1a6; }
.dev-label { right: 64px; }
.pv { outline: 1px dashed var(--line); outline-offset: 2px; }
.pv .dev { background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(180deg, var(--metal-2), var(--metal)); background-size: 8px 8px, 8px 8px, auto; }
.grp-box { position: absolute; z-index: 4; border: 1px dashed rgba(143,209,166,.55); border-radius: 3px; cursor: move; touch-action: none; }
.grp-box:hover, .grp-box.moving { border: 2px solid #8fd1a6; background: rgba(143,209,166,.12); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 9);
const push = (map, k, v) => { const a = map.get(k); a ? a.push(v) : map.set(k, [v]); };
let inFrame = false;
try { inFrame = window.top !== window.self; } catch { inFrame = true; }

let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}
function download(name, text, mime = 'application/json') {
  try {
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch { /* ignore */ }
  if (inFrame) toast('Downloads are blocked in this preview. Use Copy instead, or open the app file on your Mac.', 5000);
}
async function copyText(text, what = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(what); }
  catch { openModal('Copy this text', `<textarea id="copy-area" readonly>${esc(text)}</textarea><p class="muted small">Select all, then copy.</p>`); }
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y) return iso;
  return new Date(y, m - 1, d).toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
}

let project;
const ui = {
  tab: 'rack', patchId: null, sel: null, faces: {}, showTies: false,
  layer: 'patch', libSel: null, libQuery: '', addQuery: '', armed: null,
};

function patch() { return project.patches.find((p) => p.id === ui.patchId) || project.patches[0]; }

function migrate(p) {
  // Every saved file carries a schema number. When the format changes,
  // add a step here so older files keep opening.
  if (!p.schema) p.schema = 1;
  p.library ||= []; p.racks ||= []; p.locations ||= []; p.devices ||= []; p.connections ||= [];
  p.patches ||= []; p.groups ||= []; p.columns ||= []; p.history ||= [];
  p.view ||= {}; p.view.cableMode ||= 'all'; p.view.cables ||= {};
  p.view.colorBy ||= 'type'; p.view.hideTypes ||= {}; if (p.view.photos === undefined) p.view.photos = true;
  if ((p.schema || 1) < 2) {
    // v0.0.6: the Avantis gets its own control network jack (separate from the Dante card)
    const av = p.library.find((d) => d.id === 'ah-avantis');
    if (av && !av.groups.some((g) => g.id === 'ctl')) {
      const i = av.groups.findIndex((g) => g.id === 'pwr');
      av.groups.splice(i < 0 ? av.groups.length : i, 0, { id: 'ctl', label: 'Network', count: 1, start: 1, conn: 'rj45', dir: 'io', face: 'rear' });
    }
    // switch ports don't get IP addresses; the switch gets one management address
    const gc = p.library.find((d) => d.id === 'luminex-gigacore30i');
    if (gc && !gc.groups.some((g) => g.id === 'mgmt')) {
      for (const g of gc.groups) if (g.id === 'eth' || g.id === 'sfp') g.ip = false;
      gc.groups.push({ id: 'mgmt', label: 'Management', count: 1, start: 1, conn: 'rj45', dir: 'io', face: 'virtual' });
    }
  }
  p.cableColors ||= JSON.parse(JSON.stringify(DEFAULT_CABLE_COLORS));
  p.print = { ...defaultPrint(), ...(p.print || {}) };
  p.print.include = { ...defaultPrint().include, ...(p.print.include || {}) };
  const have = new Set(p.library.map((d) => d.id));
  for (const d of DEFAULT_LIBRARY) if (!have.has(d.id)) p.library.push(JSON.parse(JSON.stringify(d)));
  if (!p.patches.length) p.patches.push(newPatch('Patch 1'));
  for (const pt of p.patches) { pt.sources ||= []; pt.outputs ||= []; }
  if ((p.schema || 1) < 3) {
    // v0.0.8: each gear definition lists its own IP addresses (instead of one per network jack).

  const mv = (ev) => { pe.x = st.x + (ev.clientX - st.x0) / pe.k; pe.y = st.y + (ev.clientY - st.y0) / pe.k; peDraw(); };

const COMPAT = {
  xlr: ['xlr', 'combo', 'dmx5'], combo: ['xlr', 'trs', 'combo'], trs: ['trs', 'combo', 'headphone'],
  headphone: ['trs', 'headphone'], ethercon: ['ethercon', 'rj45'], rj45: ['rj45', 'ethercon'],
  iec: ['iec', 'nema'], nema: ['nema', 'iec'], usbc: ['usbc', 'thunderbolt'], thunderbolt: ['thunderbolt', 'usbc'],
  lc: ['lc', 'opticalcon'], opticalcon: ['opticalcon', 'lc'],

const compatible = (a, b) => a === b || (COMPAT[a] || []).includes(b);

/* ---------- 4. checks ---------- */
function runChecks() {
  const out = [];
  const add = (sev, msg, sel) => out.push({ sev, msg, sel });
  const pt = patch();
  if (idx.broken.length) add('warn', `${idx.broken.length} cable(s) point at ports that no longer exist (the gear was changed or removed). Delete them from the Rig, or undo the gear change.`, null);
  for (const [ref, n] of idx.cables) if (n > 1) add('error', `${portLong(ref)} has ${n} cables in one jack.`, { kind: 'port', ref });
  for (const [ref, list] of idx.in) {
    const d = list.filter((c) => c.kind === 'dante');
    if (d.length > 1) add('error', `Dante receiver ${portLong(ref)} is subscribed ${d.length} times. A receive channel can only take one.`, { kind: 'port', ref });
  }
  for (const c of idx.active) {
    if (c.kind === 'dante') continue;
    const a = port(c.a), b = port(c.b);
    if (a.g.dir === b.g.dir && a.g.dir !== 'io') add('error', `${portLong(c.a)} is cabled to ${portLong(c.b)}: that joins two ${a.g.dir === 'in' ? 'inputs' : 'outputs'}.`, { kind: 'conn', id: c.id });
    else if (!compatible(a.g.conn, b.g.conn)) add('info', `${portLong(c.a)} (${CONN_NAMES[a.g.conn] || a.g.conn}) to ${portLong(c.b)} (${CONN_NAMES[b.g.conn] || b.g.conn}) needs an adapter or a different cable.`, { kind: 'conn', id: c.id });
    else if (!c.type && sigOf(a.g) !== sigOf(b.g) && sigOf(a.g) !== 'other' && sigOf(b.g) !== 'other') add('info', `${portLong(c.a)} carries ${sigName(sigOf(a.g))} but ${portLong(c.b)} expects ${sigName(sigOf(b.g))}.`, { kind: 'conn', id: c.id });
  }
  const ipUse = new Map();
  for (const { d, sl, v } of ipEntries()) {
    if (!v.ip) continue;
    if (!IP_RE.test(v.ip)) add('warn', `${d.name} · ${sl.label} has “${v.ip}”, which isn't a valid IP address.`, { kind: 'device', id: d.id });
    else push(ipUse, v.ip.split('/')[0], { d, sl });
  }
  for (const [ip, list] of ipUse) if (list.length > 1) add('error', `IP address ${ip} is used ${list.length} times: ${list.map((x) => `${x.d.name} · ${x.sl.label}`).join(', ')}.`, { kind: 'device', id: list[0].d.id });
  const chUse = new Map();
  for (const s of pt.sources) {
    const nm = s.name || 'Untitled source';
    const ports = (s.ports || []).filter(Boolean);
    if (!ports.length) { add('warn', `“${nm}” has no stage input yet.`, { kind: 'source', id: s.id }); continue; }
    for (const r of ports) {
      const p = port(r);
      if (!p) { add('warn', `“${nm}” is assigned to a port that no longer exists.`, { kind: 'source', id: s.id }); continue; }
      if (p.g.dir === 'out' && p.g.conn !== 'dante') add('error', `“${nm}” is assigned to an output (${portLong(r)}).`, { kind: 'source', id: s.id });
      const at = idx.srcAt.get(r) || [];
      if (at.length > 1 && at[0] === s) add('error', `${portLabel(r)} has ${at.length} sources: ${at.map((x) => '“' + (x.name || '?') + '”').join(', ')}.`, { kind: 'port', ref: r });
      const chs = consoleChannels(r);
      if (!chs.length) add('warn', `“${nm}” (${portLabel(r)}) doesn't reach a console channel. Check the cable or Dante route after ${portShort(traceTree(r).ends[0] || r)}.`, { kind: 'source', id: s.id });
      for (const ch of chs) push(chUse, ch, s);
    }
  }
  for (const [ch, list] of chUse) {
    const uniq = [...new Set(list)];
    if (uniq.length > 1) add('error', `${portLong(ch)} receives ${uniq.map((s) => '“' + s.name + '”').join(' and ')}.`, { kind: 'port', ref: ch });
  }
  const order = { error: 0, warn: 1, info: 2 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

const PITCH = { rca: 18, mini: 14, usbc: 14, thunderbolt: 14, displayport: 18, lc: 16, opticalcon: 26, toslink: 16, xlr: 26, combo: 26, dmx5: 26, dmx3: 26, ethercon: 24, rj45: 19, trs: 18, headphone: 18, bnc: 17, sfp: 19, phoenix: 13, iec: 28, nema: 28, dc: 16, speakon: 28, powercon: 28, usb: 15, hdmi: 20 };
const layoutCache = new Map();
function groupDims(g, s, h, top) {
  const p = (PITCH[g.conn] || 20) * s;
  const lab = g.nolabel ? 0 : 10 * Math.max(s, 0.7);
  const maxRows = Math.max(1, Math.floor((h - top - lab - 2) / p));
  let rows = g.rows || (g.count <= 12 ? 1 : g.count <= 24 ? 2 : 4);
  rows = Math.max(1, Math.min(rows, maxRows, g.count));
  const cols = Math.ceil(g.count / rows);
  return { p, lab, rows, cols, bw: cols * p, bh: rows * p + lab };
}
function layoutFace(def, face, w, h) {
  const key = `${def.id}|${face}|${w}|${h}|${JSON.stringify(def.groups.map((g) => [g.id, g.label, g.count, g.conn, g.face, g.rows, g.pos]))}|${JSON.stringify(def.layout?.[face] || null)}`;
  if (layoutCache.has(key)) return layoutCache.get(key);
  const gs = def.groups.filter((g) => g.face === face);
  let best = null;
  const fixed = def.layout?.[face];
  if (fixed) {
    // positions set by dragging port groups in the Library
    const s = fixed.s || 1, pad = 14, top = 14;
    const ports = [], labels = [], blocks = [];
    let bottom = top;
    for (const g of [...gs.filter((g) => g.pos), ...gs.filter((g) => !g.pos)]) {
      const dm = groupDims(g, s, h, top);
      const x = g.pos ? g.pos.x : pad, y = g.pos ? g.pos.y : bottom + 3;
      if (!g.nolabel) labels.push({ x, y, text: g.label, s });
      for (let i = 0; i < g.count; i++) {
        const r = Math.floor(i / dm.cols), c = i % dm.cols;
        ports.push({ gid: g.id, n: i + 1, x: x + c * dm.p, y: y + dm.lab + r * dm.p, p: dm.p, conn: g.conn, dir: g.dir });
      }
      blocks.push({ gid: g.id, x, y, w: dm.bw, h: dm.bh });
      bottom = Math.max(bottom, y + dm.bh);
    }
    best = { ports, labels, blocks, s, fixed: true };
    layoutCache.set(key, best);
    return best;
  }
  for (let s = 1; s >= 0.3; s -= 0.06) {
    const pad = 14, top = 14; let x = pad, y = top, bandH = 0, maxR = 0;
    const ports = [], labels = [], blocks = [];
    for (const g of gs) {
      const { p, lab, cols, bw, bh } = groupDims(g, s, h, top);
      if (x + bw > w - pad && x > pad) { x = pad; y += bandH + 3; bandH = 0; }
      blocks.push({ gid: g.id, x, y, w: bw, h: bh });
      if (!g.nolabel) labels.push({ x, y, text: g.label, s });
      for (let i = 0; i < g.count; i++) {
        const r = Math.floor(i / cols), c = i % cols;
        ports.push({ gid: g.id, n: i + 1, x: x + c * p, y: y + lab + r * p, p, conn: g.conn, dir: g.dir });
      }
      x += bw + 12 * s; bandH = Math.max(bandH, bh); maxR = Math.max(maxR, x - 12 * s);
    }
    best = { ports, labels, blocks, s };
    if (y + bandH <= h - 1 && maxR <= w - pad + 2) break;
  }
  layoutCache.set(key, best);
  return best;
}
function portShape(conn, p) {
  const d = p * 0.68;
  if (conn === 'phoenix') return { w: p * 0.62, h: p * 0.5 };
  if (conn === 'iec' || conn === 'nema') return { w: p * 0.7, h: p * 0.52 };
  if (conn === 'rj45' || conn === 'sfp') return { w: p * 0.66, h: p * 0.56 };
  if (['hdmi', 'usb', 'usbc', 'thunderbolt', 'displayport', 'lc', 'toslink'].includes(conn)) return { w: p * 0.72, h: p * 0.38 };

// which device sits in each U (left/right half) of a rack.
// `ov` optionally overrides some devices' places, to test a move before making it.
function occupancy(rack, ov = null) {
  const occ = {}; for (let u = 1; u <= rack.ru; u++) occ[u] = { L: null, R: null };
  for (const d of project.devices) {
    const place = ov?.get(d.id) || d.place;
    if (place?.type !== 'rack' || place.rackId !== rack.id) continue;
    const def = idx.def.get(d.defId); const ru = def?.ru || 1;
    for (let u = place.u; u < place.u + ru; u++) {
      const o = occ[u];
      if (!o) { occ.over = true; continue; }
      if (place.side === 'full') { if (o.L || o.R) occ.clash = true; o.L = d.id; o.R = d.id; }
      else { if (o[place.side]) occ.clash = true; o[place.side] = d.id; }
    }
  }
  return occ;
}
function canPlace(rack, u, ru, side, ignoreId) {
  if (u < 1 || u + ru - 1 > rack.ru) return false;
  const occ = occupancy(rack);
  for (let x = u; x < u + ru; x++) {
    const o = occ[x]; const L = o.L === ignoreId ? null : o.L, R = o.R === ignoreId ? null : o.R;
    if (side === 'full' && (L || R)) return false;
    if (side === 'L' && L) return false;
    if (side === 'R' && R) return false;
  }
  return true;
}

// Work out how to move gear to `dest`. If other gear is in the way in the same
// rack, it slides into the space being vacated (e.g. drag a 5U unit down past a
// 1U unit and the 1U ends up above it). Returns { ok, moves: [[devId, place]], msg }.
function planMove(d, dest) {
  const def = idx.def.get(d.defId); const h = def?.ru || 1;
  if (dest.type === 'loc') {
    const loc = project.locations.find((l) => l.id === dest.locId);
    if (dest.x == null) return { ok: true, moves: [[d.id, { type: 'loc', locId: loc.id }]], shuffled: 0 };
    // pin every other piece of gear in this location to where it is shown now
    const before = locLayout(loc);
    const moves = [[d.id, { type: 'loc', locId: loc.id, x: dest.x, y: dest.y }]];
    for (const o of before.devs) if (o.id !== d.id && o.place.x == null) { const b = before.map.get(o.id); if (b) moves.push([o.id, { ...o.place, x: b.x, y: b.y }]); }
    const sz = devSize(def);
    for (const [oid, b] of before.map) {
      if (oid === d.id) continue;
      if (dest.x < b.x + b.w && dest.x + sz.w > b.x && dest.y < b.y + b.h && dest.y + sz.h > b.y) return { ok: false, msg: `That spot overlaps ${idx.dev.get(oid)?.name}.` };
    }
    return { ok: true, moves, shuffled: 0 };
  }
  if (def.form !== 'rack') return { ok: false, msg: `${def.model} isn't rack-mountable. Change its mounting in the Library first.` };
  const rack = project.racks.find((r) => r.id === dest.rackId);
  const side = def.width === 'half' ? (dest.side === 'full' ? 'L' : dest.side) : 'full';
  const u = dest.u;
  if (u < 1 || u + h - 1 > rack.ru) return { ok: false, msg: `A ${h}U unit at U${u} runs past the bottom of ${rack.name}.` };
  const target = { type: 'rack', rackId: rack.id, u, side };
  if (canPlace(rack, u, h, side, d.id)) return { ok: true, moves: [[d.id, target]], shuffled: 0 };
  if (d.place.type !== 'rack' || d.place.rackId !== rack.id) return { ok: false, msg: `That space in ${rack.name} is taken. Make room there first.` };
  const others = project.devices.filter((x) => x.id !== d.id && x.place.type === 'rack' && x.place.rackId === rack.id);
  const span = (x) => [x.place.u, x.place.u + (idx.def.get(x.defId)?.ru || 1) - 1];
  const moves = [[d.id, target]];
  if (side !== 'full') {
    // half-rack gear trades places with one half-rack unit of the same height
    const hit = others.filter((x) => { const [a, b] = span(x); return a <= u + h - 1 && b >= u && (x.place.side === 'full' || x.place.side === side); });
    const x = hit[0];
    if (hit.length === 1 && x.place.side !== 'full' && x.place.u === u && (idx.def.get(x.defId)?.ru || 1) === h) moves.push([x.id, { ...d.place }]);
    else return { ok: false, msg: 'Half-rack gear can only trade places with another half-rack unit of the same height.' };
  } else {
    const u0 = d.place.u;
    const [r0, r1, shift] = u > u0 ? [u0 + h, u + h - 1, -h] : [u, u0 - 1, h];
    for (const x of others) {
      const [a, b] = span(x);
      if (b < r0 || a > r1) continue;
      if (a < r0 || b > r1) return { ok: false, msg: `${x.name} (${b - a + 1}U) is in the way and can't slide past cleanly. Try one space further, or move it first.` };
      moves.push([x.id, { ...x.place, u: a + shift }]);

}

// Consecutive connections that run in step (In 1→Line 1, In 2→Line 2…) are written as one range.
function compressRuns(rows) {
  rows.sort((x, y) => x.gi - y.gi || x.mine.n - y.mine.n);
  const out = []; let run = null;
  for (const r of rows) {
    if (run && run.key === r.key && r.mine.n === run.last.mine.n + 1 && r.other.n === run.last.other.n + 1) { run.last = r; run.count++; }
    else { if (run) out.push(run); run = { key: r.key, first: r, last: r, count: 1 }; }
  }
  if (run) out.push(run);
  return out.map((run) => {
    const a = run.first, b = run.last; const many = run.count > 1;
    const cname = (p) => p.dev.portNames?.[`${p.g.id}:${p.n}`];
    const mine = `${a.mine.g.label} ${portNum(a.mine)}${many ? '–' + portNum(b.mine) : ''}${!many && cname(a.mine) ? ` “${cname(a.mine)}”` : ''}`;
    const other = `${a.other.dev.name} · ${a.other.g.label} ${portNum(a.other)}${many ? '–' + portNum(b.other) : ''}${!many && cname(a.other) ? ` “${cname(a.other)}”` : ''}`;
    return { mine, dir: a.dir, other, tags: a.tags };
  });
}
function sheetLines(d) {
  const inc = project.sheet.include; const pid = patch().id;
  const def = idx.def.get(d.defId); const gi = (p) => def.groups.indexOf(p.g);
  const cab = [], dan = [];
  for (const c of project.connections) {
    if (c.layer !== 'rig' && !(inc.patch && c.layer === pid)) continue;
    if (c.kind === 'dante' ? !inc.dante : c.kind === 'tie' ? !inc.ties : !inc.cables) continue;
    const pa = port(c.a), pb = port(c.b); if (!pa || !pb) continue;
    for (const [mine, other, dir] of [[pa, pb, '→'], [pb, pa, '←']]) {
      if (mine.dev.id !== d.id) continue;
      if (c.kind === 'dante' && dir === '→') continue; // routes are listed on the receiving unit
      const t = connType(c);
      const tags = c.kind === 'dante' ? [] : [c.kind === 'tie' ? 'tie line' : '', t !== 'analog' ? sigName(t) : '', c.spec || '', c.layer === 'rig' ? '' : 'this patch only'].filter(Boolean);
      (c.kind === 'dante' ? dan : cab).push({ mine, other, dir, gi: gi(mine), tags, key: [mine.g.id, other.dev.id, other.g.id, dir, c.kind, tags.join(',')].join('|') });
    }
  }
  const named = inc.dante ? def.groups.filter((g) => g.conn === 'dante' && g.dir === 'out').flatMap((g) => Array.from({ length: g.count }, (_, i) => [i + 1, d.portNames?.[`${g.id}:${i + 1}`]]).filter(([, n]) => n).map(([n, nm]) => `${g.label} ${n} “${nm}”`)) : [];
  return { cables: compressRuns(cab), dante: compressRuns(dan), named };
}

  src: (el) => commit(`Edited ${findSrc(el.dataset.id)?.name || 'source'}`, () => { findSrc(el.dataset.id)[el.dataset.f] = el.value; }),
  srcCustom: (el) => commit('Edited a custom column', () => { const s = findSrc(el.dataset.id); (s.custom ||= {})[el.dataset.c] = el.value; }),
  srcPort: (el) => commit(`Patched ${findSrc(el.dataset.id)?.name}`, () => { const s = findSrc(el.dataset.id); s.ports ||= []; s.ports[+el.dataset.i] = el.value; }),
  out: (el) => commit('Edited an output', () => { patch().outputs.find((o) => o.id === el.dataset.id)[el.dataset.f] = el.value; }),
  patchField: (el) => commit('Edited patch details', () => { patch()[el.dataset.f] = el.value; }),
  groupField: (el) => commit('Edited a group', (p) => { p.groups.find((g) => g.id === el.dataset.id)[el.dataset.f] = el.value; }),
  colName: (el) => commit('Renamed a column', (p) => { p.columns.find((c) => c.id === el.dataset.id).name = el.value; }),
  ccField: (el) => commit('Edited a cable colour', (p) => { p.cableColors.find((c) => c.id === el.dataset.id)[el.dataset.f] = el.value; }),
  danteSub: (el) => {
    const rx = el.dataset.ref, tx = el.value; const layer = ui.layer === 'rig' ? 'rig' : patch().id;
    ui.danteEdit = null;
    commit(tx ? `Dante: ${portShort(tx)} → ${portShort(rx)}` : `Dante: cleared ${portShort(rx)}`, (p) => {
      p.connections = p.connections.filter((c) => !(c.kind === 'dante' && c.b === rx && (c.layer === layer || c.layer === 'rig' || c.layer === patch().id)));
      if (tx) p.connections.push({ id: uid('c'), a: tx, b: rx, kind: 'dante', layer, color: '' });
    });
  },
  printField: (el) => commit('', (p) => { const f = el.dataset.f; p.print[f] = el.type === 'checkbox' ? el.checked : f === 'fontSize' ? +el.value : el.value; }),
  printInc: (el) => commit('', (p) => { p.print.include[el.dataset.k] = el.checked; }),
  printCol: (el) => commit('', () => { printColumns().find((c) => c.key === el.dataset.k).on = el.checked; }),
  defField: (el) => commit('Edited gear', () => {
    const d = libDef(); const f = el.dataset.f;
    if (f === 'verified') d.verified = el.checked;
    else if (f === 'ru' || f === 'watts') d[f] = Math.max(f === 'ru' ? 1 : 0, +el.value || 0);
    else d[f] = el.value;
  }),
  grpField: (el) => commit('Edited gear', () => {
    const g = libDef().groups[+el.dataset.i]; const f = el.dataset.f;
    if (f === 'count') g.count = Math.max(1, Math.min(256, +el.value || 1));
    else if (f === 'rows') { if (+el.value > 0) g.rows = +el.value; else delete g.rows; }
    else if (f === 'names') { const n = el.value.split(',').map((x) => x.trim()).filter(Boolean); if (n.length) g.names = n; else delete g.names; }
    else if (f === 'src') g.src = el.checked;
    else if (f === 'signal') { if (el.value) g.signal = el.value; else delete g.signal; }
    else { if (f === 'face' && g.face !== el.value) delete g.pos; g[f] = el.value; }
    layoutCache.clear();
  }),
  linkField: (el) => commit('Edited gear', () => {
    const L = libDef().links[+el.dataset.i]; const f = el.dataset.f;
    if (f === 'count') { if (+el.value > 0) L.count = +el.value; else delete L.count; }
    else if (f === 'fromStart' || f === 'toStart') L[f] = Math.max(1, +el.value || 1);
    else L[f] = el.value;
  }),
};
const inputs = {
  peFine: (el) => { pe.fine = +el.value; const fv = $('#pe-fine-v'); if (fv) fv.textContent = `${pe.fine}°`; peDraw(); },
  peZoom: (el) => { pe.s = peFillScale() * (+el.value / 100); peDraw(); },
  connQuery: (el) => { ui.connQuery = el.value; const s = $('#pt-target'); if (s) s.innerHTML = connectOptions(el.dataset.ref, el.value); },
  addQuery: (el) => {
    ui.addQuery = el.value;
    const tmp = document.createElement('div'); tmp.innerHTML = inspectorHTML();
    $('#add-list').innerHTML = $('#add-list', tmp).innerHTML;
  },
  libQuery: (el) => {
    ui.libQuery = el.value;
    const tmp = document.createElement('div'); tmp.innerHTML = libraryView();
    $('#lib-list').innerHTML = $('#lib-list', tmp).innerHTML;
  },
};

document.addEventListener('click', (e) => {
  if (ui.suppressClick) { ui.suppressClick = false; return; }
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) { const fn = actions[el.dataset.act]; if (fn) { fn(el, e); return; } }
  const hit = e.target.closest('path.hit');
  if (hit) { select({ kind: 'conn', id: hit.dataset.conn }); return; }
  if (!e.target.closest('.menu')) closeMenu();
  if (ui.armed && !el) { ui.armed = null; render(); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]');
  if (el && changes[el.dataset.chg]) changes[el.dataset.chg](el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-inp]');
  if (el && inputs[el.dataset.inp]) inputs[el.dataset.inp](el, e);
});
document.addEventListener('pointerdown', onPointerDown);
document.addEventListener('wheel', (e) => {
  if (e.target.id !== 'pe-canvas' || !pe?.img) return;
  e.preventDefault(); pe.s *= e.deltaY < 0 ? 1.06 : 1 / 1.06; peSync(); peDraw();
}, { passive: false });
document.addEventListener('dblclick', (e) => {
  if (e.target.closest('#pt-target') && ui.sel?.kind === 'port') actions.connectPicked({ dataset: { ref: ui.sel.ref } });
});
document.addEventListener('toggle', (e) => {
  const d = e.target; if (d.classList?.contains('dgrp') && d.dataset.dev) (ui.danteOpen ||= {})[d.dataset.dev] = d.open;
  if (d.classList?.contains('sec') && d.dataset.sec) { secState[d.dataset.sec] = d.open; try { localStorage.setItem('patchrack.sections', JSON.stringify(secState)); } catch { /* storage unavailable */ } }
  if (d.id === 'view-menu') ui.viewOpen = d.open;
}, true);
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (ui.pick) { ui.pick = null; render(); } else if (ui.sel) select(null); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && ui.sel?.kind === 'conn') { const id = ui.sel.id; commit('Removed a cable', (p) => { p.connections = p.connections.filter((c) => c.id !== id); }); select(null); }
});
window.addEventListener('resize', () => { if (ui.tab === 'rack') drawCables(); });

function readFile(input, cb) {
  const f = input.files?.[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { cb(r.result, f); input.value = ''; }; r.readAsText(f);
}
$('#file-open').addEventListener('change', (e) => readFile(e.target, (txt) => {
  try { const p = JSON.parse(txt); if (!p.devices || !p.library) throw 0; replaceProject(p, 'Project opened'); }
  catch { toast("That file isn't a PatchRack project."); }
}));
$('#file-lib').addEventListener('change', (e) => readFile(e.target, (txt) => {
  try {
    const j = JSON.parse(txt); const gear = j.gear || j.library || (Array.isArray(j) ? j : null); if (!gear) throw 0;
    let added = 0, updated = 0;
    commit('Imported gear library', (p) => {
      for (const g of gear) {
        if (!g.id || !g.groups) continue;
        const i = p.library.findIndex((d) => d.id === g.id);
        if (i >= 0) { p.library[i] = g; updated++; } else { p.library.push(g); added++; }
      }
    });
    layoutCache.clear(); toast(`Library imported: ${added} new, ${updated} updated.`);
  } catch { toast("That file isn't a gear library."); }
}));
$('#file-photo').addEventListener('change', async (e) => {
  const f = e.target.files?.[0]; const t = ui.photoTarget; e.target.value = ''; if (!f || !t) return;
  try {
    const url = await resizeImage(f, 1600);
    openPhotoEditor(t.defId, t.face, url, null);
  } catch { toast("That file couldn't be read as an image. Try a JPG or PNG."); }
});
$('#file-logo').addEventListener('change', (e) => {
  const f = e.target.files?.[0]; if (!f) return;
  if (f.size > 1.5e6) { toast('Please use a logo image under 1.5 MB.'); return; }
  const r = new FileReader(); r.onload = () => { commit('Added logo', (p) => { p.print.logo = r.result; }); e.target.value = ''; }; r.readAsDataURL(f);
});

/* start-up lives in main.js, which loads after github.js */

/* =====================================================================
   GitHub sync
   Saves the open project to projects/<name>.patchrack.json in the
   GitHub repository, and opens projects from there. Every save is a
   commit, so GitHub keeps every version.
   The token is kept only in this browser on this computer.
   ===================================================================== */

const GH_KEY = 'patchrack.github';
const GH_FILE_KEY = 'patchrack.ghfile';
const gh = {
  cfg: { owner: 'kyleb-ppac', repo: 'patchrack', branch: 'main', token: '' },
  file: null,      // { path, sha, dirty } for the project that is open
  busy: false,
};
try { Object.assign(gh.cfg, JSON.parse(localStorage.getItem(GH_KEY) || '{}')); } catch { /* none saved */ }
try { gh.file = JSON.parse(localStorage.getItem(GH_FILE_KEY) || 'null'); } catch { gh.file = null; }

function ghStoreCfg() { try { localStorage.setItem(GH_KEY, JSON.stringify(gh.cfg)); } catch { /* storage unavailable */ } }
function ghStoreFile() { try { localStorage.setItem(GH_FILE_KEY, JSON.stringify(gh.file)); } catch { /* storage unavailable */ } }
function ghMarkDirty() { if (gh.file) { gh.file.dirty = true; ghStoreFile(); } renderGh(); }

function ghApi(path, opts = {}) {
  const base = `https://api.github.com/repos/${encodeURIComponent(gh.cfg.owner)}/${encodeURIComponent(gh.cfg.repo)}`;
  return fetch(base + (path ? '/' + path : ''), {
    ...opts,
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${gh.cfg.token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {}),
    },
  });
}
const ghContents = (path) => `contents/${path.split('/').map(encodeURIComponent).join('/')}`;
const ghRef = () => `?ref=${encodeURIComponent(gh.cfg.branch)}`;
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
const ghSlug = (s) => (s || 'project').trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-') || 'project';
function ghExplain(res) {
  if (res.status === 401) return 'GitHub rejected the token. It may have expired or been pasted incorrectly. Open File → GitHub settings and paste a new one.';
  if (res.status === 403) return 'The token is missing permission. It needs “Contents: Read and write” for this repository.';
  if (res.status === 404) return 'GitHub could not find the repository. Check the owner and name in GitHub settings, and that the token includes this repository.';
  return `GitHub returned an error (${res.status}). Try again in a minute.`;
}
function ghReady() {
  if (inFrame) { toast('GitHub saving works in the PatchRack.html file on your Mac, not in this preview.', 5000); return false; }
  if (!gh.cfg.token) { actions.ghSettings(); return false; }
  return true;
}

function renderGh(text) {
  const b = $('#gh-status'); if (!b) return;
  b.hidden = inFrame;
  if (text) { b.textContent = text; b.className = 'gh-status'; return; }
  if (!gh.cfg.token) { b.textContent = 'Connect GitHub'; b.className = 'gh-status'; b.title = 'Set up saving to GitHub'; return; }
  if (!gh.file) { b.textContent = 'Not on GitHub yet'; b.className = 'gh-status dirty'; b.title = 'Save this project to GitHub (Cmd+S)'; return; }
  const name = gh.file.path.split('/').pop();
  if (gh.file.dirty) { b.textContent = 'Unsaved changes'; b.className = 'gh-status dirty'; b.title = `Save to GitHub as ${name} (Cmd+S)`; }
  else { b.textContent = 'Saved to GitHub'; b.className = 'gh-status clean'; b.title = name; }
}

async function ghSave({ force = false, path = null } = {}) {
  if (!ghReady() || gh.busy) return;
  path = path || gh.file?.path || `projects/${ghSlug(project.name)}.patchrack.json`;
  gh.busy = true; renderGh('Saving…');
  try {
    let sha = gh.file?.path === path ? gh.file.sha : null;
    if (!sha || force) {
      const cur = await ghApi(ghContents(path) + ghRef());
      if (cur.ok) {
        const j = await cur.json();
        if (!force) { gh.busy = false; renderGh(); ghConflict(path, 'exists'); return; }
        sha = j.sha;
      } else if (cur.status !== 404) throw cur;
    }
    const last = project.history[0]?.msg;
    const res = await ghApi(ghContents(path), {
      method: 'PUT',
      body: JSON.stringify({
        message: `Save ${project.name || 'project'}${last ? ': ' + last : ''}`,
        content: b64encode(JSON.stringify(project, null, 1)),
        branch: gh.cfg.branch,
        ...(sha ? { sha } : {}),
      }),
    });
    if (res.status === 409 || res.status === 422) { gh.busy = false; renderGh(); ghConflict(path, 'changed'); return; }
    if (!res.ok) throw res;
    const j = await res.json();
    gh.file = { path, sha: j.content.sha, dirty: false }; ghStoreFile();
    toast(`Saved to GitHub: ${path}`);
  } catch (e) {
    toast(e instanceof Response ? ghExplain(e) : 'Could not reach GitHub. Check the internet connection.', 6000);
  }
  gh.busy = false; renderGh();
}

function ghConflict(path, why) {
  openModal('GitHub has a different version', `
    <p style="margin:0">${why === 'exists'
      ? `A project called <b>${esc(path)}</b> is already on GitHub.`
      : `<b>${esc(path)}</b> was changed on GitHub since you opened it, possibly from another computer.`}</p>
    <div class="toolbar">
      <button class="primary" data-act="ghOpenPath" data-path="${esc(path)}">Open the GitHub version</button>
      <button class="danger" data-act="ghOverwrite" data-path="${esc(path)}">Replace it with mine</button>
      <button data-act="ghSaveAs">Save mine under a new name</button>
    </div>
    <p class="small muted" style="margin:0">Opening the GitHub version keeps your current work in Undo. Replacing is safe too: GitHub keeps every earlier version.</p>`);
}

async function ghOpen(path) {
  if (!ghReady()) return;
  try {
    const meta = await ghApi(ghContents(path) + ghRef());
    if (!meta.ok) throw meta;
    const j = await meta.json();
    let text;
    if (j.content && j.encoding === 'base64') text = b64decode(j.content);
    else {
      const raw = await ghApi(ghContents(path) + ghRef(), { headers: { Accept: 'application/vnd.github.raw+json' } });
      if (!raw.ok) throw raw;
      text = await raw.text();
    }
    const p = JSON.parse(text);
    if (!p.devices || !p.library) { toast("That file isn't a PatchRack project."); return; }
    closeModal();
    replaceProject(p, `Opened ${path.split('/').pop()} from GitHub`);
    gh.file = { path, sha: j.sha, dirty: false }; ghStoreFile(); renderGh();
  } catch (e) {
    toast(e instanceof Response ? ghExplain(e) : "Could not open that project. Check the internet connection.", 6000);
  }
}

async function ghList() {
  if (!ghReady()) return;
  openModal('Open from GitHub', '<p class="muted" style="margin:0">Loading projects…</p>');
  let files = [];
  try {
    const res = await ghApi(ghContents('projects') + ghRef());
    if (res.status !== 404) {
      if (!res.ok) throw res;
      files = (await res.json()).filter((f) => f.type === 'file' && f.name.endsWith('.json'));
    }
  } catch (e) {
    closeModal(); toast(e instanceof Response ? ghExplain(e) : 'Could not reach GitHub.', 6000); return;
  }
  openModal('Open from GitHub', files.length
    ? `<div class="list">${files.map((f) => `<button data-act="ghOpenPath" data-path="${esc(f.path)}"><span>${esc(f.name.replace(/\.patchrack\.json$|\.json$/, ''))}</span><small>${Math.ceil(f.size / 1024)} KB${gh.file?.path === f.path ? ' · open now' : ''}</small></button>`).join('')}</div>
       <p class="small muted" style="margin:0">To see older versions of a project, open the file on github.com and click History.</p>`
    : '<p style="margin:0">No projects on GitHub yet. Use “Save to GitHub” to add this one.</p>');
}

function ghSettingsHTML() {
  return `
    <p class="small" style="margin:0">PatchRack saves projects into the <b>projects</b> folder of your GitHub repository. It needs a token, which works like a password that only opens this one repository.</p>
    <details><summary class="small" style="cursor:pointer"><b>How to make a token</b></summary>
      <ol class="small" style="display:grid;gap:4px;padding-left:18px">
        <li>On github.com, click your profile picture → <b>Settings</b>.</li>
        <li>At the bottom of the left menu: <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b>.</li>
        <li><b>Generate new token</b>. Name it “PatchRack”. Pick an expiration (up to a year).</li>
        <li><b>Repository access</b>: Only select repositories → <b>${esc(gh.cfg.owner)}/${esc(gh.cfg.repo)}</b>.</li>
        <li><b>Permissions</b> → Repository permissions → <b>Contents: Read and write</b>.</li>
        <li><b>Generate token</b>, copy it, and paste it below.</li>
      </ol></details>
    <div class="inline-fields">
      <label class="field"><span>Owner</span><input id="gh-owner" value="${esc(gh.cfg.owner)}"></label>
      <label class="field"><span>Repository</span><input id="gh-repo" value="${esc(gh.cfg.repo)}"></label>
      <label class="field"><span>Branch</span><input id="gh-branch" value="${esc(gh.cfg.branch)}" style="width:100px"></label>
    </div>
    <label class="field"><span>Token ${gh.cfg.token ? '(one is saved; paste a new one to replace it)' : ''}</span><input id="gh-token" type="password" autocomplete="off" placeholder="${gh.cfg.token ? '••••••••••••' : 'github_pat_…'}"></label>
    <div class="toolbar"><button class="primary" data-act="ghSaveSettings">Save &amp; test</button>${gh.cfg.token ? '<button class="danger" data-act="ghForget">Forget token on this computer</button>' : ''}</div>
    <p class="small muted" style="margin:0">The token stays in this browser on this computer and is only sent to GitHub. On a new computer, paste it again (or make a new one).</p>`;
}

Object.assign(actions, {
  ghSave: () => { closeMenu(); ghSave(); },
  ghList: () => { closeMenu(); ghList(); },
  ghOpenPath: (el) => ghOpen(el.dataset.path),
  ghOverwrite: (el) => { closeModal(); ghSave({ force: true, path: el.dataset.path }); },
  ghSaveAs: () => openModal('Save under a new name', `
    <label class="field"><span>Project file name</span><input id="gh-newname" value="${esc(ghSlug(project.name) + '-copy')}"></label>
    <div class="toolbar"><button class="primary" data-act="ghSaveAsGo">Save to GitHub</button></div>`),
  ghSaveAsGo: () => {
    const name = ghSlug($('#gh-newname').value); closeModal();
    ghSave({ path: `projects/${name}.patchrack.json` });
  },
  ghSettings: () => { closeMenu(); openModal('GitHub settings', ghSettingsHTML()); },
  ghForget: () => { gh.cfg.token = ''; ghStoreCfg(); closeModal(); renderGh(); toast('Token removed from this computer.'); },
  ghSaveSettings: async () => {
    gh.cfg.owner = $('#gh-owner').value.trim(); gh.cfg.repo = $('#gh-repo').value.trim();
    gh.cfg.branch = $('#gh-branch').value.trim() || 'main';
    const t = $('#gh-token').value.trim(); if (t) gh.cfg.token = t;
    ghStoreCfg(); renderGh();
    if (!gh.cfg.token) { toast('Paste a token first.'); return; }
    try {
      const res = await ghApi('');
      if (!res.ok) throw res;
      closeModal(); toast(`Connected to ${gh.cfg.owner}/${gh.cfg.repo}.`);
    } catch (e) { toast(e instanceof Response ? ghExplain(e) : 'Could not reach GitHub.', 6000); }
  },
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); ghSave(); }
});

/* ---------- start-up (loaded last) ---------- */
try { const t = localStorage.getItem('patchrack.theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* storage unavailable */ }
load();
render();
renderGh();

</script>
