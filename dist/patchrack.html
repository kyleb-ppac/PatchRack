<title>PatchRack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Rack elevations and patchlists that stay in sync.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell = top bar + one working view; the rack view is a scrolling
   "stage" of rack elevations with an inspector beside it. Gear faceplates are
   always dark metal (like the real thing) in both themes. */
:root {
  --bg: #eceff3;
  --panel: #ffffff;
  --panel-2: #f6f8fa;
  --fg: #18202a;
  --muted: #5a6776;
  --line: #d3d9e0;
  --accent: #3a5068;          /* Peace Portal slate */
  --accent-fg: #ffffff;
  --accent-soft: #dfe7ef;
  --trace: #f2a900;
  --err: #c2362f;
  --warn: #b26a00;
  --info: #2f6f9f;
  --ok: #2f7d4f;

  /* hardware (same in both themes) */
  --metal: #23272c;
  --metal-2: #2c3137;
  --rail: #121417;
  --silk: #d7dce1;
  --silk-dim: #8c949c;
  --jack: #0c0e10;
  --ring-in: #c7ced6;
  --ring-out: #e3a548;
  --ring-io: #6fbf8e;
  --ring-v: #9aa3ad;
  --plug: #f4f6f8;

  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --panel: #192028; --panel-2: #1f2730; --fg: #e5eaf0; --muted: #95a2b0;
    --line: #2c3540; --accent: #8db1d6; --accent-fg: #0f1720; --accent-soft: #24313f;
    --err: #ff7a70; --warn: #f0b456; --info: #7fb6e6; --ok: #73c995;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --panel: #192028; --panel-2: #1f2730; --fg: #e5eaf0; --muted: #95a2b0;
  --line: #2c3540; --accent: #8db1d6; --accent-fg: #0f1720; --accent-soft: #24313f;
  --err: #ff7a70; --warn: #f0b456; --info: #7fb6e6; --ok: #73c995;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.4 var(--f-ui);
  display: flex; flex-direction: column; min-height: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .port:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.danger { color: var(--err); }
button.armed { background: var(--err); color: #fff; border-color: var(--err); }
button:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-width: 0;
}
input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.spacer { flex: 1; }
h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; } h3 { font-size: 17px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: .03em; }
.brand-mark { width: 22px; height: 22px; border-radius: 3px; background:
  radial-gradient(circle at 30% 35%, var(--accent-fg) 0 2.5px, transparent 3px),
  radial-gradient(circle at 70% 35%, var(--accent-fg) 0 2.5px, transparent 3px),
  radial-gradient(circle at 30% 70%, var(--accent-fg) 0 2.5px, transparent 3px),
  radial-gradient(circle at 70% 70%, var(--accent-fg) 0 2.5px, transparent 3px), var(--accent); }
.proj-name { font-weight: 600; width: 230px; max-width: 100%; }
.patch-pick { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.patch-pick select { color: var(--fg); font-size: 14px; max-width: 200px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; border-radius: 4px; padding: 6px 10px; color: var(--muted); font-weight: 500; }
.tabs button.on { background: var(--accent-soft); color: var(--fg); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; background: var(--err); color: #fff; margin-left: 4px; font-family: var(--f-mono); }
.badge.warn { background: var(--warn); }
.badge.zero { background: var(--ok); }
.top-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: var(--r); padding: 5px 10px; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: 250px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 2px;
}
.menu-pop button { border: 0; text-align: left; }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tog { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
.seg { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg > span { padding: 0 8px; font-size: 12px; color: var(--muted); }
.seg button { border: 0; border-left: 1px solid var(--line); border-radius: 0; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.note {
  background: var(--accent-soft); border-radius: var(--r); padding: 8px 12px; font-size: 13px;
  display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
}
.note button { padding: 2px 8px; }

/* ---------- rack view ---------- */
.rack-split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .rack-split { grid-template-columns: minmax(0, 1fr); } }
.stage {
  overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2);
  max-height: calc(100vh - 170px); min-height: 360px; user-select: none; -webkit-user-select: none;
}
.stage-inner { position: relative; display: flex; gap: 28px; padding: 18px; align-items: flex-start; width: max-content; }
.cables { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 5; }
.cables path.hit { pointer-events: stroke; cursor: pointer; }
.rack { flex: none; }
.rack-head, .loc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rack-title { font-family: var(--f-display); font-size: 18px; font-weight: 600; letter-spacing: .03em; cursor: pointer; background: none; border: 0; padding: 0; }
.rack-title:hover { color: var(--accent); }
.face-btn { font-size: 11px; padding: 2px 8px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.rack-body { position: relative; display: grid; grid-template-columns: 22px auto 22px; background: var(--rail); border-radius: 4px; padding: 6px 0; }
.rail { position: relative; }
.rail span { position: absolute; left: 0; right: 0; text-align: center; font: 9px/1 var(--f-mono); color: #6f7880; }
.rail i { position: absolute; left: 7px; width: 8px; height: 5px; border-radius: 2px; background: #2e3338; }
.rack-bay { position: relative; background: repeating-linear-gradient(180deg, #181b1f 0 47px, #1d2126 47px 48px); }
.slot {
  position: absolute; border: 1px dashed transparent; color: transparent; font: 11px var(--f-mono);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.slot:hover, .slot.sel { border-color: #5d6670; color: #9aa3ad; }
.slot.sel { border-style: solid; border-color: var(--trace); color: var(--trace); }

.dev {
  position: absolute; background: linear-gradient(180deg, var(--metal-2), var(--metal)); border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 1px 0 rgba(0,0,0,.6);
  color: var(--silk); overflow: hidden;
}
.dev::before, .dev::after { /* rack ear screws */
  content: ""; position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: #4b5259; box-shadow: inset 0 0 0 1px #1a1d20;
}
.dev::before { left: 4px; } .dev::after { right: 4px; }
.dev.half-L::after, .dev.half-R::before { display: none; }
.dev.free::before, .dev.free::after { display: none; }
.dev.sel { box-shadow: inset 0 0 0 2px var(--trace); }
.dev-label {
  position: absolute; left: 12px; right: 12px; top: 2px; height: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font: 600 10.5px/13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
}
.dev-label b { color: #fff; font-weight: 600; }
.dev-label em { font-style: normal; color: var(--silk-dim); }
.dev-label .unv { color: #e3a548; margin-left: 4px; }
.dev-empty { position: absolute; left: 12px; bottom: 4px; font-size: 10px; color: var(--silk-dim); }
.grp-label { position: absolute; font: 600 8.5px/10px var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--silk-dim); white-space: nowrap; }
.dev.st-blank { background: linear-gradient(180deg, #2b3036, #24282d); }
.dev.st-vent { background: repeating-linear-gradient(90deg, #2a2f35 0 10px, #111316 10px 13px); background-size: 100% 60%; background-position: center; background-repeat: no-repeat; background-color: #2a2f35; }
.dev.st-drawer .dev-empty { left: 50%; transform: translateX(-50%); bottom: 50%; width: 90px; height: 7px; border-radius: 4px; background: #4a5057; font-size: 0; }

.port {
  position: absolute; border-radius: 50%; background: var(--fill, var(--jack));
  box-shadow: inset 0 0 0 2px var(--ring, var(--ring-in)), 0 0 0 1px #000;
  cursor: crosshair; touch-action: none;
}
.port.d-in { --ring: var(--ring-in); }
.port.d-out { --ring: var(--ring-out); }
.port.d-io { --ring: var(--ring-io); }
.port.c-rj45, .port.c-sfp { border-radius: 2px; }
.port.c-iec, .port.c-nema { border-radius: 3px; }
.port.c-phoenix { border-radius: 1px; }
.port.c-ethercon::before { content: ""; position: absolute; inset: 28% 24%; border-radius: 1px; background: rgba(255,255,255,.12); }
.port.plugged::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--plug); box-shadow: 0 0 0 1px #000; }
.port.c-rj45.plugged::after, .port.c-sfp.plugged::after, .port.c-iec.plugged::after, .port.c-phoenix.plugged::after { border-radius: 1px; }
.port.hl { box-shadow: inset 0 0 0 2px var(--trace), 0 0 0 2px var(--trace), 0 0 10px 2px rgba(242,169,0,.55); }
.port.sel { box-shadow: inset 0 0 0 2px #fff, 0 0 0 3px var(--trace), 0 0 12px 3px rgba(242,169,0,.7); }
.port.drop { box-shadow: 0 0 0 3px #6fbf8e; }
.pn { position: absolute; font: 500 8px/1 var(--f-mono); color: var(--silk-dim); text-align: center; white-space: nowrap; pointer-events: none; }
.pn.named { color: var(--silk); }

.locs { display: flex; flex-direction: column; gap: 22px; flex: none; }
.loc { flex: none; }
.loc-body { display: flex; flex-wrap: wrap; gap: 10px; width: 540px; padding: 10px; border: 1px dashed #6b747d; border-radius: 6px; }
.loc-body .dev { position: relative; }
.loc-empty { color: var(--muted); font-size: 12px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--jack); box-shadow: inset 0 0 0 2px var(--ring); vertical-align: -2px; margin-right: 4px; }

/* ---------- inspector ---------- */
.inspector {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px;
  display: grid; gap: 12px; max-height: calc(100vh - 170px); overflow: auto; position: sticky; top: 70px; min-width: 0;
}
.inspector .row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; }
.inspector .row label { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 1px 6px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.chip.ch { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.arrow { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; border-radius: 3px; padding: 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .03em; }
.pill.unv { background: #fbe8c8; color: #7a4a00; }
.pill.ver { background: #d5efdf; color: #1d5a35; }
.pill.rig { background: var(--accent-soft); color: var(--fg); }
.pill.patch { background: #f4dff0; color: #6d2160; }
.list { display: grid; gap: 2px; }
.list button { text-align: left; display: flex; justify-content: space-between; gap: 8px; border-color: transparent; background: var(--panel-2); }
.list button:hover { border-color: var(--accent); }
.list button small { color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); vertical-align: -2px; }

/* ---------- tables (patchlist, dante, library) ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.tbl-wrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid td input, table.grid td select { width: 100%; }
table.grid td.num { font-family: var(--f-mono); color: var(--muted); text-align: right; width: 28px; }
table.grid td.comp { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
table.grid tr.sel td { background: var(--accent-soft); }
.grpcell { display: flex; gap: 4px; align-items: center; min-width: 110px; }
.inputcell { display: flex; gap: 4px; align-items: center; min-width: 210px; }
.inputcell select { min-width: 0; }
.st-tog { font-size: 11px; padding: 2px 5px; }
.st-tog.on { background: var(--accent); color: var(--accent-fg); }
.rowbtns { display: flex; gap: 2px; }
.rowbtns button { padding: 2px 6px; font-size: 12px; }
.path { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-size: 11.5px; }
.editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.field { display: grid; gap: 3px; } .field > span { font-size: 12px; color: var(--muted); }
.inline-fields { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.inline-fields .field input, .inline-fields .field select { width: 180px; }

/* dante */
.dsub { width: 100%; text-align: left; border-style: dashed; font-family: var(--f-mono); font-size: 12px; padding: 3px 6px; }
.dsub.set { border-style: solid; }
details.dgrp > summary { cursor: pointer; padding: 6px 0; font-weight: 600; }

/* library */
.lib-split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 800px) { .lib-split { grid-template-columns: minmax(0,1fr); } }
.lib-list { max-height: calc(100vh - 220px); overflow: auto; }
.lib-list button.on { border-color: var(--accent); background: var(--accent-soft); }

/* checks */
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 4px; background: var(--panel-2); }
.sev { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 3px; color: #fff; flex: none; }
.sev.error { background: var(--err); } .sev.warn { background: var(--warn); } .sev.info { background: var(--info); }
.check .msg { flex: 1; min-width: 0; }

/* ---------- print ---------- */
.print-split { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .print-split { grid-template-columns: minmax(0,1fr); } }
.print-opts { display: grid; gap: 12px; }
.colpick { display: grid; gap: 2px; }
.colpick div { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; }
.colpick div:hover { background: var(--panel-2); }
.colpick label { flex: 1; display: flex; gap: 6px; align-items: center; }
.colpick button { padding: 0 6px; font-size: 11px; }
.paper-wrap { overflow: auto; background: #8a929b; border-radius: var(--r); padding: 20px; max-height: calc(100vh - 160px); }
.paper {
  width: 8.5in; min-height: 11in; margin: 0 auto; background: #fff; color: #111; box-shadow: 0 4px 20px rgba(0,0,0,.3);
  font-family: var(--f-ui); font-size: var(--pfs, 11px); color-scheme: light;
}
.paper.landscape { width: 11in; min-height: 8.5in; }
.paper .phead { display: flex; justify-content: flex-end; align-items: center; height: 0.95in; padding: 0 0.45in; color: #fff; }
.paper .phead img { max-height: 0.62in; max-width: 3.2in; }
.paper .phead .org { font-family: var(--f-display); font-size: 30px; font-weight: 600; letter-spacing: .01em; }
.paper .pbody { padding: 0.3in 0.6in 0.5in; display: grid; gap: 10px; }
.paper .ptitle { font-size: 1.6em; margin: 6px 0 2px; font-weight: 500; }
.paper .pmeta { display: grid; gap: 4px; font-size: 1.15em; }
.paper table { border-collapse: collapse; width: 100%; }
.paper th { color: #fff; font-weight: 500; padding: 3px 6px; border: 1px solid #222; text-align: center; }
.paper td { border: 1px solid #222; padding: 2px 6px; }
.paper td.c { text-align: center; vertical-align: middle; }
.paper h4 { font-size: 1.45em; font-weight: 500; margin: 8px 0 0; }
.paper .map p { margin: 3px 0 0; font-size: 1.15em; }
.paper .map .ind { padding-left: 1.6em; }
.paper .pull { columns: 2; font-size: 1.05em; }
.paper .pfoot { font-size: .85em; color: #666; margin-top: 8px; }
.paper .pnote { font-size: .95em; color: #444; }

/* ---------- modal & toast ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,14,18,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-box { background: var(--panel); border-radius: 8px; max-width: 680px; width: 100%; max-height: 85vh; overflow: auto; padding: 18px; display: grid; gap: 12px; }
.modal-box textarea { width: 100%; min-height: 240px; font: 12px var(--f-mono); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.hist { display: grid; gap: 2px; font-size: 13px; }
.hist div { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }

/* ------------------------------------------------------------------ */
/* Sample project, built from the Sunday Nov 8 2026 patchlist          */
/* ------------------------------------------------------------------ */
function buildSample() {
  const now = new Date().toISOString();
  const p = {
    schema: SCHEMA, name: 'Sanctuary', created: now, modified: now, sample: true,
    library: JSON.parse(JSON.stringify(DEFAULT_LIBRARY)),
    racks: [], locations: [], devices: [], connections: [], patches: [],
    groups: [], columns: [{ id: 'col_stand', name: 'Stand' }],
    cableColors: JSON.parse(JSON.stringify(DEFAULT_CABLE_COLORS)),
    print: defaultPrint(), history: [],
  };
  const rack = (name, ru) => { const r = { id: uid('r'), name, ru }; p.racks.push(r); return r; };
  const loc = (name) => { const l = { id: uid('l'), name }; p.locations.push(l); return l; };
  const dev = (defId, name, short, place, extra = {}) => {
    const d = { id: uid('d'), defId, name, short, place, portNames: {}, labels: {}, ...extra };
    p.devices.push(d); return d;
  };
  const R = (r, u, side = 'full') => ({ type: 'rack', rackId: r.id, u, side });
  const L = (l) => ({ type: 'loc', locId: l.id });
  const con = (a, b, kind = 'cable', layer = 'rig', color = '') =>
    p.connections.push({ id: uid('c'), a, b, kind, layer, color });
  const ref = (d, g, n) => `${d.id}.${g}:${n}`;

  // Racks (layouts are placeholders - move things to match the real racks)
  const stA = rack('Stage Rack A', 8);
  const stB = rack('Stage Rack B', 6);
  const back = rack('Backstage', 4);
  const rf = rack('RF / IEM', 8);
  const amp = rack('Amp Rack', 7);

  const rioA = dev('yamaha-rio3224-d2', 'Rio A', 'RIO A', R(stA, 1));
  dev('luminex-gigacore30i', 'GigaCore 30i', 'GC30', R(stA, 6));
  dev('vent-1u', 'Vent', 'VENT', R(stA, 7));
  dev('cyberpower-or500lcdrm1u', 'UPS A', 'UPS A', R(stA, 8));

  const rioB = dev('yamaha-rio3224-d2', 'Rio B', 'RIO B', R(stB, 1));
  dev('blank-1u', 'Blank', 'BLANK', R(stB, 6));

  const tio = dev('yamaha-tio1608-d', 'Tio', 'TIO', R(back, 1), {
    labels: { in: { prefix: 'TIO', start: 1 } }, zone: 'Backstage', position: 'Tio',
  });
  dev('drawer-2u', 'Drawer', 'DRAWER', R(back, 3));

  const ulx1 = dev('shure-ulxd4q', 'ULX-D4Q 1', 'ULXD1', R(rf, 1));
  const ulx2 = dev('shure-ulxd4q', 'ULX-D4Q 2', 'ULXD2', R(rf, 2));
  const psmA = dev('shure-psm900-p9t', 'PSM900 A', 'PSM9 A', R(rf, 3, 'L'));
  const psmB = dev('shure-psm900-p9t', 'PSM900 B', 'PSM9 B', R(rf, 3, 'R'));
  const psm3 = dev('shure-psm300-p3t', 'PSM300', 'PSM3', R(rf, 4, 'L'));
  dev('blank-half-1u', 'Half blank', 'BLANK', R(rf, 4, 'R'));
  const mac = dev('sonnet-rackmac-mini', 'Playback Mac', 'MAC', R(rf, 5));
  dev('vent-1u', 'Vent', 'VENT', R(rf, 6));
  dev('cyberpower-or500lcdrm1u', 'UPS RF', 'UPS RF', R(rf, 7));

  const ahm = dev('ah-ahm32', 'AHM-32', 'AHM', R(amp, 1));
  const amp1 = dev('generic-amp-2ch', 'Mains amp', 'AMP 1', R(amp, 2));
  const amp2 = dev('generic-amp-2ch', 'Sub amp', 'AMP 2', R(amp, 4));
  dev('cyberpower-or500lcdrm1u', 'UPS Amp', 'UPS AMP', R(amp, 6));

  // Locations
  const pockets = loc('Stage floor pockets');
  const foh = loc('FOH');
  const avantis = dev('ah-avantis', 'Avantis', 'AVANTIS', L(foh));

  const pocketDefs = [
    ['Down-stage', 'Stage Right', 7], ['Down-stage', 'Stage Center', 13], ['Down-stage', 'Stage Left', 19],
    ['Mid-stage', 'Stage Right', 1], ['Mid-stage', 'Stage Left', 25],
    ['Up-stage', 'Stage Right', 31], ['Up-stage', 'Stage Left', 37],
  ];
  const zoneShort = { 'Down-stage': 'DS', 'Mid-stage': 'MS', 'Up-stage': 'US' };
  const posShort = { 'Stage Right': 'SR', 'Stage Center': 'SC', 'Stage Left': 'SL' };
  const pocket = {};
  for (const [zone, pos, start] of pocketDefs) {
    const tag = `${zoneShort[zone]}-${posShort[pos]}`;
    const d = dev('floor-pocket-6', `Pocket ${tag}`, `FP ${tag}`, L(pockets), {
      zone, position: pos, labels: { in: { prefix: 'RIO', start }, tie: { prefix: 'Line', start } },
    });
    pocket[tag] = d;
    // in-wall tie lines: line 1-32 -> Rio A in 1-32, line 33+ -> Rio B in 1+
    for (let i = 1; i <= 6; i++) {
      const line = start + i - 1;
      con(ref(d, 'tie', i), line <= 32 ? ref(rioA, 'in', line) : ref(rioB, 'in', line - 32), 'tie');
    }
  }

  // Wireless channel names
  ['VOX 1', 'VOX 2', 'VOX 3', 'PRAYER MIC'].forEach((n, i) => { ulx1.portNames[`rf:${i + 1}`] = n; ulx1.portNames[`dtx:${i + 1}`] = n; });
  ['PREACH MIC', 'HOST MIC'].forEach((n, i) => { ulx2.portNames[`rf:${i + 1}`] = n; ulx2.portNames[`dtx:${i + 1}`] = n; });
  mac.portNames['dtx:1'] = 'PLAYBACK CLICK';
  mac.portNames['dtx:2'] = 'PLAYBACK TRACKS';
  avantis.portNames['dtx:1'] = 'MAIN L'; avantis.portNames['dtx:2'] = 'MAIN R'; avantis.portNames['dtx:3'] = 'SUB';

/* =====================================================================

/* ---------- 1. utilities ---------- */
const SCHEMA = 1;
const STORE_KEY = 'patchrack.project';
const U = 48;      // pixels per rack unit
const W = 520;     // pixels per 19" panel width
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 2. state & saving ---------- */
let project;
const ui = {
  tab: 'rack', patchId: null, sel: null, faces: {}, showCables: true, showTies: false,
  layer: 'patch', libSel: null, libQuery: '', addQuery: '', armed: null,
};
const undoStack = [], redoStack = [];

function patch() { return project.patches.find((p) => p.id === ui.patchId) || project.patches[0]; }

function migrate(p) {
  // Every saved file carries a schema number. When the format changes,
  // add a step here so older files keep opening.
  if (!p.schema) p.schema = 1;
  p.library ||= []; p.racks ||= []; p.locations ||= []; p.devices ||= []; p.connections ||= [];
  p.patches ||= []; p.groups ||= []; p.columns ||= []; p.history ||= [];
  p.cableColors ||= JSON.parse(JSON.stringify(DEFAULT_CABLE_COLORS));
  p.print = { ...defaultPrint(), ...(p.print || {}) };
  p.print.include = { ...defaultPrint().include, ...(p.print.include || {}) };
  const have = new Set(p.library.map((d) => d.id));
  for (const d of DEFAULT_LIBRARY) if (!have.has(d.id)) p.library.push(JSON.parse(JSON.stringify(d)));
  if (!p.patches.length) p.patches.push(newPatch('Patch 1'));
  for (const pt of p.patches) { pt.sources ||= []; pt.outputs ||= []; }
  for (const d of p.devices) { d.portNames ||= {}; d.labels ||= {}; }
  p.schema = SCHEMA;

}
function newPatch(name) {
  return { id: uid('p'), name, event: name, date: new Date().toISOString().slice(0, 10), sources: [], outputs: [] };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(project)); } catch { /* storage unavailable */ }
}
function load() {
  let p = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) p = JSON.parse(raw); } catch { p = null; }
  project = migrate(p || buildSample());
  fixUi();
}
function fixUi() {
  if (!project.patches.some((p) => p.id === ui.patchId)) ui.patchId = project.patches[0]?.id;
  ui.sel = null;
}
function commit(msg, fn, { quiet = false } = {}) {
  undoStack.push(JSON.stringify(project)); if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  fn(project);
  if (msg) {
    project.history.unshift({ t: new Date().toISOString(), msg, patch: patch()?.name || '' });
    if (project.history.length > 500) project.history.length = 500;
  }
  project.modified = new Date().toISOString();
  save();
  if (!quiet) scheduleRender();
}
let renderPending = false;
function scheduleRender() {
  if (renderPending) return; renderPending = true;
  setTimeout(() => { renderPending = false; render(); }, 0);
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(project)); project = JSON.parse(undoStack.pop());
  if (!project.patches.some((p) => p.id === ui.patchId)) fixUi();
  save(); render(); toast('Undone');
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(project)); project = JSON.parse(redoStack.pop());
  if (!project.patches.some((p) => p.id === ui.patchId)) fixUi();
  save(); render(); toast('Redone');
}
function replaceProject(p, msg) {
  undoStack.push(JSON.stringify(project)); redoStack.length = 0;
  project = migrate(p); ui.patchId = null; fixUi();
  project.history.unshift({ t: new Date().toISOString(), msg, patch: '' });
  save(); render(); toast(msg);
}

/* ---------- 3. signal model ---------- */
let idx = {};
const mkRef = (devId, gid, n) => `${devId}.${gid}:${n}`;
function parseRef(ref) {
  const m = /^([^.]+)\.([^:]+):(\d+)$/.exec(ref || '');
  return m && { devId: m[1], gid: m[2], n: +m[3] };
}
function port(ref) {
  const r = parseRef(ref); if (!r) return null;
  const dev = idx.dev.get(r.devId); if (!dev) return null;
  const def = idx.def.get(dev.defId); if (!def) return null;
  const g = def.groups.find((x) => x.id === r.gid);
  if (!g || r.n < 1 || r.n > g.count) return null;
  return { ref, dev, def, g, n: r.n };
}
function portNum(p) {
  const ov = p.dev.labels?.[p.g.id] || {};
  if (p.g.names?.[p.n - 1]) return p.g.names[p.n - 1];
  return String((+(ov.start ?? p.g.start ?? 1)) + p.n - 1);
}
function portParts(p) {
  const custom = p.dev.portNames?.[`${p.g.id}:${p.n}`];
  if (custom) return { custom };
  const ov = p.dev.labels?.[p.g.id] || {};
  return { prefix: ov.prefix ?? `${p.dev.short} ${p.g.label}`, num: portNum(p) };
}
function portLabel(ref) {
  const p = port(ref); if (!p) return '(missing port)';
  const x = portParts(p); return x.custom ?? `${x.prefix} ${x.num}`.trim();
}
function portShort(ref) {
  const p = port(ref); if (!p) return '(missing port)';
  const custom = p.dev.portNames?.[`${p.g.id}:${p.n}`];
  const base = `${p.dev.short} ${p.g.label} ${p.g.names?.[p.n - 1] ?? ((p.g.start ?? 1) + p.n - 1)}`;
  return custom ? `${base} “${custom}”` : base;
}
function portLong(ref) {
  const p = port(ref); if (!p) return '(missing port)';
  const custom = p.dev.portNames?.[`${p.g.id}:${p.n}`];
  const base = `${p.dev.name} · ${p.g.label} ${p.g.names?.[p.n - 1] ?? ((p.g.start ?? 1) + p.n - 1)}`;
  return custom ? `${base} “${custom}”` : base;
}
function stereoLabel(refs) {
  refs = (refs || []).filter(Boolean);
  if (!refs.length) return '';
  if (refs.length === 1) return portLabel(refs[0]);
  const a = port(refs[0]), b = port(refs[1]);
  if (a && b) {
    const pa = portParts(a), pb = portParts(b);
    if (!pa.custom && !pb.custom && pa.prefix === pb.prefix) return `${pa.prefix} ${pa.num}/${pb.num}`;
  }
  return refs.map(portLabel).join(' + ');
}
const isPhysical = (g) => g.face === 'front' || g.face === 'rear';

function buildIndex() {
  idx = {
    dev: new Map(project.devices.map((d) => [d.id, d])),
    def: new Map(project.library.map((d) => [d.id, d])),
    out: new Map(), in: new Map(), cables: new Map(), active: [], broken: [],
    srcAt: new Map(), mark: new Map(), outMark: new Map(),
  };
  const pid = patch()?.id;
  for (const c of project.connections) {
    if (c.layer !== 'rig' && c.layer !== pid) continue;
    if (!port(c.a) || !port(c.b)) { idx.broken.push(c); continue; }
    idx.active.push(c); push(idx.out, c.a, c); push(idx.in, c.b, c);
    if (c.kind !== 'dante') {
      idx.cables.set(c.a, (idx.cables.get(c.a) || 0) + 1);
      idx.cables.set(c.b, (idx.cables.get(c.b) || 0) + 1);
    }
  }
  const pt = patch();
  for (const s of pt.sources) for (const r of s.ports || []) {
    if (!r) continue;
    push(idx.srcAt, r, s);
    for (const x of traceTree(r).parent.keys()) if (!idx.mark.has(x)) idx.mark.set(x, s);
  }
  for (const o of pt.outputs) if (o.port) for (const x of traceTree(o.port).parent.keys()) if (!idx.outMark.has(x)) idx.outMark.set(x, o);
}

// where does the signal at `ref` go next?
function next(ref) {
  const p = port(ref); if (!p) return [];
  const res = [];
  for (const c of idx.out.get(ref) || []) {
    const b = port(c.b); if (!b) continue;
    if (p.g.dir === 'io' || b.g.dir === 'io') continue;   // network links aren't audio paths
    res.push(c.b);
  }
  for (const L of p.def.links || []) {
    if (L.from !== p.g.id) continue;
    const fs = L.fromStart || 1, ts = L.toStart || 1, cnt = L.count ?? 1e9;
    if (p.n < fs || p.n >= fs + cnt) continue;
    const tn = ts + (p.n - fs);
    const tg = p.def.groups.find((g) => g.id === L.to);
    if (tg && tn >= 1 && tn <= tg.count) res.push(mkRef(p.dev.id, L.to, tn));
  }
  const pb = p.def.patchbay;
  if (pb) {
    const mode = p.dev.normalling?.[p.n] || pb.mode || 'half';
    const used = (g) => (idx.cables.get(mkRef(p.dev.id, g, p.n)) || 0) > 0;
    if (p.g.id === pb.rt) {
      if (used(pb.ft)) res.push(mkRef(p.dev.id, pb.ft, p.n));
      const normalled = mode === 'normal' ? !used(pb.ft) && !used(pb.fb) : mode === 'half' ? !used(pb.fb) : false;
      if (normalled) res.push(mkRef(p.dev.id, pb.rb, p.n));
    }
    if (p.g.id === pb.fb) res.push(mkRef(p.dev.id, pb.rb, p.n));
  }
  return res;
}
// where did the signal at `ref` come from?
function prev(ref) {
  const p = port(ref); if (!p) return [];
  const res = [];
  for (const c of idx.in.get(ref) || []) {
    const a = port(c.a); if (!a) continue;
    if (p.g.dir === 'io' || a.g.dir === 'io') continue;
    res.push(c.a);
  }
  for (const L of p.def.links || []) {
    if (L.to !== p.g.id) continue;
    const fs = L.fromStart || 1, ts = L.toStart || 1, cnt = L.count ?? 1e9;
    const fn = fs + (p.n - ts);
    if (fn < fs || fn >= fs + cnt) continue;
    const fg = p.def.groups.find((g) => g.id === L.from);
    if (fg && fn >= 1 && fn <= fg.count) res.push(mkRef(p.dev.id, L.from, fn));
  }
  const pb = p.def.patchbay;
  if (pb) {
    const mode = p.dev.normalling?.[p.n] || pb.mode || 'half';
    const used = (g) => (idx.cables.get(mkRef(p.dev.id, g, p.n)) || 0) > 0;
    if (p.g.id === pb.ft) res.push(mkRef(p.dev.id, pb.rt, p.n));
    if (p.g.id === pb.rb) {
      if (used(pb.fb)) res.push(mkRef(p.dev.id, pb.fb, p.n));
      const normalled = mode === 'normal' ? !used(pb.ft) && !used(pb.fb) : mode === 'half' ? !used(pb.fb) : false;
      if (normalled) res.push(mkRef(p.dev.id, pb.rt, p.n));
    }
  }
  return res;
}
function traceTree(start, step = next) {
  const parent = new Map([[start, null]]); const q = [start]; const ends = [];
  while (q.length) {
    const r = q.shift();
    const nx = step(r).filter((x) => !parent.has(x));
    if (!nx.length) ends.push(r);
    for (const x of nx) { parent.set(x, r); q.push(x); }

  }

}
function pathTo(tree, end) { const out = []; for (let r = end; r; r = tree.parent.get(r)) out.unshift(r); return out; }
function consoleChannels(start) {
  return [...traceTree(start).parent.keys()].filter((r) => port(r)?.g.conn === 'channel');
}
function chLabel(ref) {
  const p = port(ref); if (!p) return '';
  const consoles = project.devices.filter((d) => idx.def.get(d.defId)?.groups.some((g) => g.conn === 'channel')).length;
  return `${consoles > 1 ? p.dev.short + ' ' : ''}Ch ${portNum(p)}`;
}
function sourceChannels(s) {
  const out = [];
  for (const r of s.ports || []) if (r && port(r)) out.push(...consoleChannels(r));
  return out;
}
function sourcePaths(s) {
  const paths = [];
  for (const r of s.ports || []) {
    if (!r || !port(r)) continue;
    const t = traceTree(r);
    const ends = t.ends.length ? t.ends : [r];
    const pref = ends.filter((e) => port(e)?.g.conn === 'channel');
    for (const e of (pref.length ? pref : ends).slice(0, 2)) paths.push(pathTo(t, e));
  }
  return paths;
}

const COMPAT = {
  xlr: ['xlr', 'combo', 'dmx5'], combo: ['xlr', 'trs', 'combo'], trs: ['trs', 'combo', 'headphone'],
  headphone: ['trs', 'headphone'], ethercon: ['ethercon', 'rj45'], rj45: ['rj45', 'ethercon'],
  iec: ['iec', 'nema'], nema: ['nema', 'iec'],
};
const compatible = (a, b) => a === b || (COMPAT[a] || []).includes(b);

/* ---------- 4. checks ---------- */
function runChecks() {
  const out = [];
  const add = (sev, msg, sel) => out.push({ sev, msg, sel });
  const pt = patch();
  if (idx.broken.length) add('warn', `${idx.broken.length} cable(s) point at ports that no longer exist (the gear was changed or removed). Delete them from the Rig, or undo the gear change.`, null);
  for (const [ref, n] of idx.cables) if (n > 1) add('error', `${portLong(ref)} has ${n} cables in one jack.`, { kind: 'port', ref });
  for (const [ref, list] of idx.in) {
    const d = list.filter((c) => c.kind === 'dante');
    if (d.length > 1) add('error', `Dante receiver ${portLong(ref)} is subscribed ${d.length} times. A receive channel can only take one.`, { kind: 'port', ref });
  }
  for (const c of idx.active) {
    if (c.kind === 'dante') continue;
    const a = port(c.a), b = port(c.b);
    if (a.g.dir === b.g.dir && a.g.dir !== 'io') add('error', `${portLong(c.a)} is cabled to ${portLong(c.b)}: that joins two ${a.g.dir === 'in' ? 'inputs' : 'outputs'}.`, { kind: 'conn', id: c.id });
    else if (!compatible(a.g.conn, b.g.conn)) add('info', `${portLong(c.a)} (${CONN_NAMES[a.g.conn] || a.g.conn}) to ${portLong(c.b)} (${CONN_NAMES[b.g.conn] || b.g.conn}) needs an adapter or a different cable.`, { kind: 'conn', id: c.id });
  }
  const chUse = new Map();
  for (const s of pt.sources) {
    const nm = s.name || 'Untitled source';
    const ports = (s.ports || []).filter(Boolean);
    if (!ports.length) { add('warn', `“${nm}” has no stage input yet.`, { kind: 'source', id: s.id }); continue; }
    for (const r of ports) {
      const p = port(r);
      if (!p) { add('warn', `“${nm}” is assigned to a port that no longer exists.`, { kind: 'source', id: s.id }); continue; }
      if (p.g.dir === 'out' && p.g.conn !== 'dante') add('error', `“${nm}” is assigned to an output (${portLong(r)}).`, { kind: 'source', id: s.id });
      const at = idx.srcAt.get(r) || [];
      if (at.length > 1 && at[0] === s) add('error', `${portLabel(r)} has ${at.length} sources: ${at.map((x) => '“' + (x.name || '?') + '”').join(', ')}.`, { kind: 'port', ref: r });
      const chs = consoleChannels(r);
      if (!chs.length) add('warn', `“${nm}” (${portLabel(r)}) doesn't reach a console channel. Check the cable or Dante route after ${portShort(traceTree(r).ends[0] || r)}.`, { kind: 'source', id: s.id });
      for (const ch of chs) push(chUse, ch, s);
    }
  }
  for (const [ch, list] of chUse) {
    const uniq = [...new Set(list)];

const PITCH = { xlr: 26, combo: 26, dmx5: 26, dmx3: 26, ethercon: 24, rj45: 19, trs: 18, headphone: 18, bnc: 17, sfp: 19, phoenix: 13, iec: 28, nema: 28, dc: 16, speakon: 28, powercon: 28, usb: 15, hdmi: 20 };

function sourcePortOptions() {
  let html = '<option value="">—</option>';
  const devs = [...project.devices].sort((a, b) => (a.place.type === 'loc' ? 0 : 1) - (b.place.type === 'loc' ? 0 : 1));
  for (const d of devs) {
    const def = idx.def.get(d.defId); if (!def) continue;
    const gs = def.groups.filter((g) => g.src); if (!gs.length) continue;
    html += `<optgroup label="${esc(d.name)}">`;
    for (const g of gs) for (let n = 1; n <= g.count; n++) { const r = mkRef(d.id, g.id, n); html += `<option value="${r}">${esc(portLabel(r))}</option>`; }
    html += '</optgroup>';
  }

}
function outputPortOptions() {
  let html = '<option value="">—</option>';
  for (const d of project.devices) {

    const gs = def.groups.filter((g) => g.dir === 'out' && isPhysical(g) && !['iec', 'nema', 'dc'].includes(g.conn)); if (!gs.length) continue;

  }
  return html;
}

function danteView() {

    const tx = def.groups.find((g) => g.conn === 'dante' && g.dir === 'out');
    const rx = def.groups.find((g) => g.conn === 'dante' && g.dir === 'in');
    if (tx) txDevs.push([d, tx]); if (rx) rxDevs.push([d, rx]);
  }
  const subOf = (ref) => (idx.in.get(ref) || []).filter((c) => c.kind === 'dante');
  const layerBtn = (v, t) => `<button data-act="layer" data-layer="${v}" class="${ui.layer === v ? 'on' : ''}">${t}</button>`;
  const rxHTML = rxDevs.map(([d, g]) => {
    let used = 0;
    const rows = Array.from({ length: g.count }, (_, i) => {
      const r = mkRef(d.id, g.id, i + 1); const subs = subOf(r); if (subs.length) used++;
      const src = idx.mark.get(r);
      const editing = ui.danteEdit === r;
      const cell = editing
        ? `<select id="dsel" data-chg="danteSub" data-ref="${r}" data-val="${subs[0]?.a || ''}">${danteTxOptions(txDevs)}</select>`
        : `<button class="dsub ${subs.length ? 'set' : ''}" data-act="danteEdit" data-ref="${r}">${subs.length ? subs.map((c) => esc(portShort(c.a))).join(' + ') : '—'}</button>`;
      return `<tr><td class="num">${i + 1}</td><td><input id="dn-${d.id}-${i}" value="${esc(d.portNames?.[`${g.id}:${i + 1}`] || '')}" placeholder="—" data-chg="portName" data-ref="${r}"></td><td>${cell}</td><td class="comp">${src ? esc(src.name) : ''}</td></tr>`;
    }).join('');
    return `<details class="dgrp card" ${ui.danteOpen?.[d.id] ?? (g.count <= 64) ? 'open' : ''} data-dev="${d.id}"><summary>${esc(d.name)} <span class="muted small">· receives ${used}/${g.count}</span></summary>

  const txHTML = txDevs.map(([d, g]) => `<details class="dgrp card"><summary>${esc(d.name)} <span class="muted small">· ${g.count} transmit channels</span></summary>
    <div class="tbl-wrap"><table class="grid"><thead><tr><th>Tx</th><th>Channel name</th><th>Source</th></tr></thead><tbody>${Array.from({ length: g.count }, (_, i) => {
      const r = mkRef(d.id, g.id, i + 1); const src = idx.mark.get(r);
      return `<tr><td class="num">${i + 1}</td><td><input id="tn-${d.id}-${i}" value="${esc(d.portNames?.[`${g.id}:${i + 1}`] || '')}" placeholder="—" data-chg="portName" data-ref="${r}"></td><td class="comp">${src ? esc(src.name) : ''}</td></tr>`;
    }).join('')}</tbody></table></div></details>`).join('');
  return `<section class="view">
    <div class="card"><div class="card-head"><h2>Dante routing</h2><span class="spacer"></span><div class="seg"><span>Changes go in</span>${layerBtn('patch', esc(patch().name))}${layerBtn('rig', 'The rig (permanent)')}</div></div>
      <p class="small muted" style="margin:0">Click a “Subscribed to” cell to choose which transmitter feeds that receive channel. The signal trace and Console Ch columns follow these routes. Importing and exporting Dante Controller preset files is planned for a later phase.</p></div>
    <h3>Receivers</h3>${rxHTML}

let txOptCache = null;
function danteTxOptions(txDevs) {
  let html = '<option value="">— none —</option>';
  for (const [d, g] of txDevs) {
    html += `<optgroup label="${esc(d.name)}">`;
    for (let n = 1; n <= g.count; n++) { const r = mkRef(d.id, g.id, n); const nm = d.portNames?.[`${g.id}:${n}`]; html += `<option value="${r}">${esc(d.short)} ${n}${nm ? ' · ' + esc(nm) : ''}</option>`; }

/* ---------- 10. print ---------- */
function colLabel(key) {
  if (key.startsWith('custom:')) return project.columns.find((c) => 'custom:' + c.id === key)?.name || '';
  return BUILTIN_COLS[key] || key;
}
function printColumns() {
  const pr = project.print;
  const keys = new Set(pr.columns.map((c) => c.key));
  for (const c of project.columns) if (!keys.has('custom:' + c.id)) pr.columns.push({ key: 'custom:' + c.id, on: false });
  pr.columns = pr.columns.filter((c) => !c.key.startsWith('custom:') || project.columns.some((x) => 'custom:' + x.id === c.key));
  return pr.columns;
}
function cellValue(s, key) {
  switch (key) {
    case 'group': return project.groups.find((g) => g.id === s.groupId)?.name || '';
    case 'source': return s.name;
    case 'mic': return s.mic;
    case 'input': return stereoLabel(s.ports);
    case 'person': return s.person;
    case 'cable': { const c = project.cableColors.find((x) => x.id === s.cable); return c ? `${c.name}${c.length ? ' ' + c.length : ''}` : ''; }
    case 'consoleCh': return sourceChannels(s).map(chLabel).join(', ');
    case 'path': return sourcePaths(s).map((p) => p.map((r) => { const pp = port(r); return pp?.g.conn === 'channel' ? 'Ch ' + portNum(pp) : portShort(r); }).join(' → ')).join(' | ');
    case 'notes': return s.notes;
    default: if (key.startsWith('custom:')) return s.custom?.[key.slice(7)] || ''; return '';
  }
}
function paperHTML() {
  const pr = project.print, pt = patch();
  const cols = printColumns().filter((c) => c.on).map((c) => c.key);
  const hc = pr.headerColor || '#3a5068';
  let body = '';
  if (pr.include.inputs && cols.length) {
    const srcs = pt.sources;
    const span = new Map();
    if (pr.mergePerson && cols.includes('person')) {
      for (let i = 0; i < srcs.length;) {
        let j = i + 1; while (j < srcs.length && srcs[i].person && srcs[j].person === srcs[i].person && srcs[j].groupId === srcs[i].groupId) j++;
        span.set(i, j - i); for (let k = i + 1; k < j; k++) span.set(k, 0); i = j;
      }
    }
    const colored = (k) => pr.colorMode === 'row' || (pr.colorMode === 'cells' && (k === 'source' || k === 'mic' || k === 'group'));
    body += `<table><thead><tr>${cols.map((k) => `<th style="background:${esc(hc)}">${esc(colLabel(k))}</th>`).join('')}</tr></thead><tbody>`;
    srcs.forEach((s, i) => {
      const bg = project.groups.find((g) => g.id === s.groupId)?.color || '';
      body += '<tr>' + cols.map((k) => {
        if (k === 'person' && span.has(i)) { const n = span.get(i); if (!n) return ''; return `<td class="c" rowspan="${n}">${esc(s.person)}</td>`; }
        const center = k === 'person' || k === 'consoleCh' || k === 'cable';
        let v = esc(cellValue(s, k));
        if (k === 'cable' && s.cable) { const c = project.cableColors.find((x) => x.id === s.cable); if (c) v = `<span style="display:inline-block;width:10px;height:10px;border:1px solid #333;background:${esc(c.hex)};vertical-align:-1px;margin-right:4px"></span>${v}`; }
        return `<td class="${center ? 'c' : ''}" style="${bg && colored(k) ? `background:${esc(bg)}` : ''}">${v}</td>`;
      }).join('') + '</tr>';
    });
    body += '</tbody></table>';
  }
  if (pr.include.outputs && pt.outputs.length) {
    body += `<h4>Outputs</h4><table><thead><tr>${['Output', 'Mix', 'Leaves on', 'Goes to', 'Person'].map((h) => `<th style="background:${esc(hc)}">${h}</th>`).join('')}</tr></thead><tbody>`;
    for (const o of pt.outputs) {
      const goes = o.port && port(o.port) ? next(o.port).map(portShort).join(', ') : '';
      body += `<tr><td>${esc(o.name)}</td><td class="c">${esc(o.mix)}</td><td>${esc(o.port ? portShort(o.port) : '')}</td><td>${esc(goes)}</td><td class="c">${esc(o.person)}</td></tr>`;
    }
    body += '</tbody></table>';
  }
  if (pr.include.stageMap) {
    const zones = new Map();
    for (const d of project.devices) {
      if (!d.zone) continue;
      const def = idx.def.get(d.defId); const g = def?.groups.find((x) => x.src && isPhysical(x)); if (!g) continue;
      const a = port(mkRef(d.id, g.id, 1)), b = port(mkRef(d.id, g.id, g.count));
      push(zones, d.zone, `${d.position || d.name}: ${portNum(a)}-${portNum(b)}`);
    }
    if (zones.size) {
      body += `<div class="map"><h4>Stage Box’s Inputs:</h4>`;
      const rank = (z) => /down/i.test(z) ? 0 : /mid/i.test(z) ? 1 : /up/i.test(z) ? 2 : 3;
      for (const [z, items] of [...zones].sort((a, b) => rank(a[0]) - rank(b[0]))) body += `<p>${esc(z)}:</p><p class="ind">${esc(items.join(', '))}</p>`;
      body += '</div>';
    }
  }
  if (pr.include.pull) {
    const mics = new Map(), cables = new Map();
    for (const s of pt.sources) {
      const n = (s.ports || []).filter(Boolean).length > 1 && /L\s*[+/&]\s*R/i.test(s.name + ' ' + s.mic) ? 2 : 1;
      for (const part of (s.mic || '').split(/\s*\+\s*/)) {
        const k = part.trim(); if (!k || /dante|direct/i.test(k)) continue;
        mics.set(k, (mics.get(k) || 0) + n);
      }
      if (s.cable) cables.set(s.cable, (cables.get(s.cable) || 0) + Math.max(1, (s.ports || []).filter(Boolean).length));
    }
    body += `<h4>Equipment needed</h4><div class="pull">${[...mics].map(([k, n]) => `<div>${n} × ${esc(k)}</div>`).join('')}${[...cables].map(([k, n]) => { const c = project.cableColors.find((x) => x.id === k); return `<div>${n} × ${esc(c?.name || k)} cable${c?.length ? ' (' + esc(c.length) + ')' : ''}</div>`; }).join('')}</div>
      <p class="pnote">Stereo rows count as two mics only when the name says L+R.</p>`;
  }
  return `<div class="paper ${pr.orientation === 'landscape' ? 'landscape' : ''}" style="--pfs:${+pr.fontSize || 11}px">
    <div class="phead" style="background:${esc(hc)}">${pr.logo ? `<img src="${esc(pr.logo)}" alt="${esc(pr.org)}">` : `<span class="org">${esc(pr.org)}</span>`}</div>
    <div class="pbody">
      <div class="ptitle">${esc(pr.title)}</div>
      <div class="pmeta"><div>Event: ${esc(pt.event)}</div><div>Date: ${esc(fmtDate(pt.date))}</div></div>
      ${body}
    </div>
  </div>`;
}

    const r = project.racks.find((x) => x.id === el.dataset.id);
    if (el.dataset.f === 'ru') {
      const ru = Math.max(1, Math.min(60, +el.value || 1));
      const low = project.devices.filter((d) => d.place.type === 'rack' && d.place.rackId === r.id).some((d) => d.place.u + (idx.def.get(d.defId)?.ru || 1) - 1 > ru);
      if (low) { toast('Some gear sits below that height. Move it first.'); render(); return; }
      commit(`Resized ${r.name}`, () => { r.ru = ru; });
    } else commit('Renamed rack', () => { r.name = el.value; });
  },
  locField: (el) => commit('Renamed location', (p) => { p.locations.find((l) => l.id === el.dataset.id).name = el.value; }),
  src: (el) => commit(`Edited ${findSrc(el.dataset.id)?.name || 'source'}`, () => { findSrc(el.dataset.id)[el.dataset.f] = el.value; }),
  srcCustom: (el) => commit('Edited a custom column', () => { const s = findSrc(el.dataset.id); (s.custom ||= {})[el.dataset.c] = el.value; }),
  srcPort: (el) => commit(`Patched ${findSrc(el.dataset.id)?.name}`, () => { const s = findSrc(el.dataset.id); s.ports ||= []; s.ports[+el.dataset.i] = el.value; }),
  out: (el) => commit('Edited an output', () => { patch().outputs.find((o) => o.id === el.dataset.id)[el.dataset.f] = el.value; }),
  patchField: (el) => commit('Edited patch details', () => { patch()[el.dataset.f] = el.value; }),
  groupField: (el) => commit('Edited a group', (p) => { p.groups.find((g) => g.id === el.dataset.id)[el.dataset.f] = el.value; }),
  colName: (el) => commit('Renamed a column', (p) => { p.columns.find((c) => c.id === el.dataset.id).name = el.value; }),
  ccField: (el) => commit('Edited a cable colour', (p) => { p.cableColors.find((c) => c.id === el.dataset.id)[el.dataset.f] = el.value; }),
  danteSub: (el) => {
    const rx = el.dataset.ref, tx = el.value; const layer = ui.layer === 'rig' ? 'rig' : patch().id;
    ui.danteEdit = null;
    commit(tx ? `Dante: ${portShort(tx)} → ${portShort(rx)}` : `Dante: cleared ${portShort(rx)}`, (p) => {
      p.connections = p.connections.filter((c) => !(c.kind === 'dante' && c.b === rx && (c.layer === layer || c.layer === 'rig' || c.layer === patch().id)));
      if (tx) p.connections.push({ id: uid('c'), a: tx, b: rx, kind: 'dante', layer, color: '' });
    });
  },
  printField: (el) => commit('', (p) => { const f = el.dataset.f; p.print[f] = el.type === 'checkbox' ? el.checked : f === 'fontSize' ? +el.value : el.value; }),
  printInc: (el) => commit('', (p) => { p.print.include[el.dataset.k] = el.checked; }),
  printCol: (el) => commit('', () => { printColumns().find((c) => c.key === el.dataset.k).on = el.checked; }),
  defField: (el) => commit('Edited gear', () => {
    const d = libDef(); const f = el.dataset.f;
    if (f === 'verified') d.verified = el.checked;
    else if (f === 'ru' || f === 'watts') d[f] = Math.max(f === 'ru' ? 1 : 0, +el.value || 0);
    else d[f] = el.value;
  }),
  grpField: (el) => commit('Edited gear', () => {
    const g = libDef().groups[+el.dataset.i]; const f = el.dataset.f;
    if (f === 'count') g.count = Math.max(1, Math.min(256, +el.value || 1));
    else if (f === 'rows') { if (+el.value > 0) g.rows = +el.value; else delete g.rows; }
    else if (f === 'names') { const n = el.value.split(',').map((x) => x.trim()).filter(Boolean); if (n.length) g.names = n; else delete g.names; }
    else if (f === 'src') g.src = el.checked;
    else g[f] = el.value;
    layoutCache.clear();
  }),
  linkField: (el) => commit('Edited gear', () => {
    const L = libDef().links[+el.dataset.i]; const f = el.dataset.f;
    if (f === 'count') { if (+el.value > 0) L.count = +el.value; else delete L.count; }
    else if (f === 'fromStart' || f === 'toStart') L[f] = Math.max(1, +el.value || 1);
    else L[f] = el.value;
  }),
};
const inputs = {
  addQuery: (el) => {
    ui.addQuery = el.value;
    const tmp = document.createElement('div'); tmp.innerHTML = inspectorHTML();
    $('#add-list').innerHTML = $('#add-list', tmp).innerHTML;
  },
  libQuery: (el) => {
    ui.libQuery = el.value;
    const tmp = document.createElement('div'); tmp.innerHTML = libraryView();
    $('#lib-list').innerHTML = $('#lib-list', tmp).innerHTML;
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) { const fn = actions[el.dataset.act]; if (fn) { fn(el, e); return; } }
  const hit = e.target.closest('path.hit');
  if (hit) { select({ kind: 'conn', id: hit.dataset.conn }); return; }
  if (!e.target.closest('.menu')) closeMenu();
  if (ui.armed && !el) { ui.armed = null; render(); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]');
  if (el && changes[el.dataset.chg]) changes[el.dataset.chg](el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-inp]');
  if (el && inputs[el.dataset.inp]) inputs[el.dataset.inp](el, e);
});
document.addEventListener('pointerdown', onPointerDown);
document.addEventListener('toggle', (e) => {
  const d = e.target; if (d.classList?.contains('dgrp') && d.dataset.dev) (ui.danteOpen ||= {})[d.dataset.dev] = d.open;
}, true);
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (ui.sel) select(null); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && ui.sel?.kind === 'conn') { const id = ui.sel.id; commit('Removed a cable', (p) => { p.connections = p.connections.filter((c) => c.id !== id); }); select(null); }
});
window.addEventListener('resize', () => { if (ui.tab === 'rack') drawCables(); });

function readFile(input, cb) {
  const f = input.files?.[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { cb(r.result, f); input.value = ''; }; r.readAsText(f);
}
$('#file-open').addEventListener('change', (e) => readFile(e.target, (txt) => {
  try { const p = JSON.parse(txt); if (!p.devices || !p.library) throw 0; replaceProject(p, 'Project opened'); }
  catch { toast("That file isn't a PatchRack project."); }
}));
$('#file-lib').addEventListener('change', (e) => readFile(e.target, (txt) => {
  try {
    const j = JSON.parse(txt); const gear = j.gear || j.library || (Array.isArray(j) ? j : null); if (!gear) throw 0;
    let added = 0, updated = 0;
    commit('Imported gear library', (p) => {
      for (const g of gear) {
        if (!g.id || !g.groups) continue;
        const i = p.library.findIndex((d) => d.id === g.id);
        if (i >= 0) { p.library[i] = g; updated++; } else { p.library.push(g); added++; }
      }
    });
    layoutCache.clear(); toast(`Library imported: ${added} new, ${updated} updated.`);
  } catch { toast("That file isn't a gear library."); }
}));
$('#file-logo').addEventListener('change', (e) => {
  const f = e.target.files?.[0]; if (!f) return;
  if (f.size > 1.5e6) { toast('Please use a logo image under 1.5 MB.'); return; }
  const r = new FileReader(); r.onload = () => { commit('Added logo', (p) => { p.print.logo = r.result; }); e.target.value = ''; }; r.readAsDataURL(f);
});

/* ---------- 14. start-up ---------- */
try { const t = localStorage.getItem('patchrack.theme'); if (t) document.documentElement.dataset.theme = t; } catch { }
load();
render();

</script>
